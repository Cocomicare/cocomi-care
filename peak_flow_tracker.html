<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="supports-loading-mode" content="credentialed-prerender">
<script type="speculationrules">
{"prefetch": [], "prerender": []}
</script>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peak Flow</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
:root {
  --bg:#F0F4F8;--surface:#FFFFFF;--surface2:#E8EFF5;--border:#D0DCE8;
  --ink:#1A2533;--ink2:#4A5E72;--ink3:#8A9EAF;
  --blue:#3B82C4;--blue-bg:#E8F1FA;
  --green:#2D9E6B;--green-bg:#E8F7F1;
  --danger:#C94040;--danger-bg:#FAEAEA;
  --warn:#E07B39;--warn-bg:#FDF0E8;
  --radius:12px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;}
.logo{display:flex;align-items:baseline;gap:8px;}
.logo-title{font-family:'DM Serif Display',serif;font-size:19px;color:var(--ink);}
.logo-sub{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;}
.header-actions{display:flex;gap:8px;}
.tabs{display:flex;background:var(--surface2);border-bottom:1px solid var(--border);padding:0 16px;}
.tab{padding:11px 16px;font-size:12px;font-weight:500;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;background:none;border-top:none;border-left:none;border-right:none;}
.tab:hover{color:var(--blue);}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);}
.page{display:none;padding:20px 16px 60px;max-width:640px;margin:0 auto;}
.page.active{display:block;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px;}
.card-title{font-family:'DM Serif Display',serif;font-size:15px;color:var(--ink);margin-bottom:16px;}
.form-row{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.form-group{display:flex;flex-direction:column;gap:5px;flex:1;min-width:120px;}
label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2);}
input[type="date"],textarea{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink);width:100%;}
input:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,196,.1);}
textarea{resize:vertical;min-height:60px;}
.time-field{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;font-size:14px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none;-webkit-tap-highlight-color:transparent;}
.readings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:8px;}
.reading-group{display:flex;flex-direction:column;align-items:center;gap:6px;}
.reading-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.reading-label.pef{color:var(--blue);}
.reading-label.fev1{color:var(--green);}
.reading-input{width:100%;text-align:center;font-family:'DM Mono',monospace;font-size:40px;font-weight:500;padding:12px 8px;border-radius:var(--radius);border:2px solid var(--border);background:var(--bg);color:var(--ink);transition:all .15s;-moz-appearance:textfield;}
.reading-input::-webkit-outer-spin-button,.reading-input::-webkit-inner-spin-button{-webkit-appearance:none;}
.reading-input.pef:focus{border-color:var(--blue);background:var(--blue-bg);}
.reading-input.fev1:focus{border-color:var(--green);background:var(--green-bg);}
.reading-input.fp{border-color:var(--blue);background:var(--blue-bg);color:var(--blue);}
.reading-input.ff{border-color:var(--green);background:var(--green-bg);color:var(--green);}
.reading-unit{font-size:12px;color:var(--ink3);margin-top:-2px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;border:none;transition:all .15s;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover{background:#2d6faa;}
.btn-primary:disabled{background:var(--border);color:var(--ink3);cursor:not-allowed;}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--ink2);}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue);}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-row{display:flex;gap:10px;justify-content:flex-end;}
.nudge{font-size:12px;padding:9px 14px;border-radius:var(--radius-sm);margin-bottom:12px;}
.nudge.ok{background:var(--green-bg);color:var(--green);}
.nudge.due{background:var(--warn-bg);color:var(--warn);}
.nudge.none{background:var(--surface2);color:var(--ink3);}
.hcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
.hcard-top{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);}
.hcard-date{flex:1;}
.hcard-date-main{font-family:'DM Mono',monospace;font-size:14px;font-weight:500;color:var(--ink);}
.hcard-date-sub{font-size:12px;color:var(--ink3);margin-top:2px;}
.hcard-btns{display:flex;gap:6px;}
.ib{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;padding:0;-webkit-tap-highlight-color:transparent;}
.ib svg{display:block;}
.ib.e:hover{background:var(--blue-bg);border-color:var(--blue);}
.ib.e:hover svg{stroke:var(--blue);}
.ib.d:hover{background:var(--danger-bg);border-color:var(--danger);}
.ib.d:hover svg{stroke:var(--danger);}
.ib:active{transform:scale(.93);}
.hcard-vals{display:grid;grid-template-columns:1fr 1fr;padding:14px 16px;gap:8px;}
.hval{display:flex;flex-direction:column;gap:3px;}
.hval-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.hval-lbl.p{color:var(--blue);}
.hval-lbl.f{color:var(--green);}
.hval-num{font-family:'DM Mono',monospace;font-size:28px;font-weight:500;line-height:1;display:flex;align-items:baseline;gap:4px;}
.hval-num.p{color:var(--blue);}
.hval-num.f{color:var(--green);}
.hval-unit{font-size:12px;opacity:.75;}
.hval-none{font-family:'DM Mono',monospace;font-size:28px;color:var(--ink3);}
.hcard-notes{padding:0 16px 12px;font-size:12px;color:var(--ink3);font-style:italic;}
.del-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--danger-bg);border-top:1px solid #f0c0c0;}
.del-bar span{font-size:13px;color:var(--danger);flex:1;}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;}
.chart-ttl{font-size:11px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;}
.chart-wrap{position:relative;height:200px;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.scard-eye{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);margin-bottom:4px;}
.scard-val{font-family:'DM Mono',monospace;font-size:24px;font-weight:500;color:var(--ink);line-height:1;}
.scard-val.b{color:var(--blue);}
.scard-val.g{color:var(--green);}
.scard-sub{font-size:11px;color:var(--ink3);margin-top:3px;}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:flex-end;justify-content:center;}
.modal.open{display:flex;}
.msheet{background:var(--surface);border-radius:20px 20px 0 0;padding:24px 20px 36px;width:100%;max-width:480px;}
.mttl{font-family:'DM Serif Display',serif;font-size:17px;color:var(--ink);margin-bottom:20px;text-align:center;}
.tp-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:24px;}
.tp-col{display:flex;flex-direction:column;align-items:center;}
.tp-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);margin-bottom:6px;}
.tp-col button{background:none;border:none;font-size:22px;color:var(--ink3);cursor:pointer;padding:4px 12px;border-radius:6px;}
.tp-val{font-family:'DM Mono',monospace;font-size:42px;font-weight:500;color:var(--ink);min-width:64px;text-align:center;background:var(--bg);border-radius:10px;padding:8px 12px;line-height:1;}
.tp-sep{font-family:'DM Mono',monospace;font-size:36px;color:var(--ink2);padding-bottom:20px;}
.tp-ap{display:flex;flex-direction:column;gap:6px;padding-bottom:20px;margin-left:8px;}
.tp-ap button{padding:10px 18px;border-radius:8px;border:1px solid var(--border);background:var(--bg);font-size:14px;font-weight:600;cursor:pointer;color:var(--ink2);transition:all .15s;}
.tp-ap button.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.mrow{display:flex;gap:10px;}
.edit-vals{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.eg label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:6px;}
.eg label.p{color:var(--blue);}
.eg label.f{color:var(--green);}
.ei{width:100%;text-align:center;font-family:'DM Mono',monospace;font-size:24px;font-weight:500;padding:10px 8px;border-radius:var(--radius-sm);border:2px solid var(--border);background:var(--bg);color:var(--ink);-moz-appearance:textfield;}
.ei::-webkit-outer-spin-button,.ei::-webkit-inner-spin-button{-webkit-appearance:none;}
.ei:focus{outline:none;border-color:var(--blue);}
.empty{text-align:center;padding:48px 20px;color:var(--ink3);}
.empty-icon{font-size:36px;margin-bottom:12px;}
.empty-ttl{font-family:'DM Serif Display',serif;font-size:18px;color:var(--ink2);margin-bottom:6px;}
.empty-sub{font-size:13px;line-height:1.5;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;z-index:999;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.success{background:var(--green);}
.toast.error{background:var(--danger);}
@media(max-width:480px){.page{padding:14px 12px 60px;}}
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-title">Peak Flow</span>
    <span class="logo-sub">FEV1 Surveillance</span>
  </div>
  <div class="header-actions">
    <button class="btn btn-ghost btn-sm" onclick="doExport()">&#8595; Export</button>
    <button class="btn btn-primary btn-sm" onclick="showTab('log')">+ New Reading</button>
  </div>
</header>

<div class="tabs">
  <button class="tab active" id="tab-log"     onclick="showTab('log')">Log Reading</button>
  <button class="tab"        id="tab-history" onclick="showTab('history')">History</button>
  <button class="tab"        id="tab-trends"  onclick="showTab('trends')">Trends</button>
</div>

<!-- LOG -->
<div class="page active" id="page-log">
  <div id="nudge" class="nudge none"></div>
  <div class="card">
    <div class="card-title">Session Details</div>
    <div class="form-row">
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="log-date">
      </div>
      <div class="form-group">
        <label>Time</label>
        <div class="time-field" onclick="openTP('log')">
          <span id="log-td">Tap to set time</span>
          <span style="color:var(--ink3)">&#128336;</span>
        </div>
        <input type="hidden" id="log-t">
      </div>
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea id="log-notes" placeholder="e.g. felt good, slight wheeze..."></textarea>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Readings</div>
    <div class="readings-grid">
      <div class="reading-group">
        <div class="reading-label pef">PEF</div>
        <input type="number" class="reading-input pef" id="log-pef" min="0" max="900" step="1" placeholder="--" oninput="onInp()">
        <div class="reading-unit">L / min</div>
      </div>
      <div class="reading-group">
        <div class="reading-label fev1">FEV1</div>
        <input type="number" class="reading-input fev1" id="log-fev1" min="0" max="10" step="0.01" placeholder="--" oninput="onInp()">
        <div class="reading-unit">L</div>
      </div>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-ghost" onclick="clearLog()">Clear</button>
    <button class="btn btn-primary" id="log-save" onclick="saveReading()" disabled>Save Reading</button>
  </div>
</div>

<!-- HISTORY -->
<div class="page" id="page-history">
  <div id="hcontent"></div>
</div>

<!-- TRENDS -->
<div class="page" id="page-trends">
  <div id="tcontent"></div>
</div>

<!-- TIME PICKER -->
<div class="modal" id="tp-modal" onclick="if(event.target===this)closeTP()">
  <div class="msheet">
    <div class="mttl">Set Time</div>
    <div class="tp-row">
      <div class="tp-col">
        <div class="tp-lbl">Hour</div>
        <button ontouchstart="sR('h',1)" onmousedown="sR('h',1)" ontouchend="eR()" onmouseup="eR()">&#9650;</button>
        <div class="tp-val" id="tph">12</div>
        <button ontouchstart="sR('h',-1)" onmousedown="sR('h',-1)" ontouchend="eR()" onmouseup="eR()">&#9660;</button>
      </div>
      <div class="tp-sep">:</div>
      <div class="tp-col">
        <div class="tp-lbl">Min</div>
        <button ontouchstart="sR('m',1)" onmousedown="sR('m',1)" ontouchend="eR()" onmouseup="eR()">&#9650;</button>
        <div class="tp-val" id="tpm">00</div>
        <button ontouchstart="sR('m',-1)" onmousedown="sR('m',-1)" ontouchend="eR()" onmouseup="eR()">&#9660;</button>
      </div>
      <div class="tp-ap">
        <button id="tpam" onclick="setAP('AM')">AM</button>
        <button id="tppm" onclick="setAP('PM')">PM</button>
      </div>
    </div>
    <div class="mrow">
      <button class="btn btn-ghost" style="flex:1" onclick="closeTP()">Cancel</button>
      <button class="btn btn-primary" style="flex:2" onclick="confirmTP()">Set Time</button>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal" id="em" onclick="if(event.target===this)closeEdit()">
  <div class="msheet">
    <div class="mttl">Edit Reading</div>
    <div class="form-row">
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="edit-date">
      </div>
      <div class="form-group">
        <label>Time</label>
        <div class="time-field" onclick="openTP('edit')">
          <span id="edit-td">Tap to set</span>
          <span style="color:var(--ink3)">&#128336;</span>
        </div>
        <input type="hidden" id="edit-t">
      </div>
    </div>
    <div class="edit-vals">
      <div class="eg"><label class="p">PEF (L/min)</label><input type="number" class="ei" id="edit-pef" min="0" max="900" step="1" placeholder="--"></div>
      <div class="eg"><label class="f">FEV1 (L)</label><input type="number" class="ei" id="edit-fev1" min="0" max="10" step="0.01" placeholder="--"></div>
    </div>
    <div class="form-group" style="margin-bottom:18px">
      <label>Notes</label>
      <textarea id="edit-notes" placeholder="e.g. felt good..."></textarea>
    </div>
    <div class="mrow">
      <button class="btn btn-ghost" style="flex:1" onclick="closeEdit()">Cancel</button>
      <button class="btn btn-primary" style="flex:2" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── STORAGE (identical pattern to spirometer_surveillance.html) ──
const KEY = 'peak_flow_sessions_v1';
function getRecs(){ try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return[];} }
function saveRecs(s){
  localStorage.setItem(KEY, JSON.stringify(s));
  syncSaveClinical('peak_flow', s)
    .then(()=>{ syncShowStatus('synced'); })
    .catch(()=>{ syncShowStatus('error'); toast('Sync failed — edit saved locally only','error'); });
}

// ── LOG ──
function onInp(){
  const p=document.getElementById('log-pef').value, f=document.getElementById('log-fev1').value;
  document.getElementById('log-pef').classList.toggle('fp', p!=='');
  document.getElementById('log-fev1').classList.toggle('ff', f!=='');
  document.getElementById('log-save').disabled = (p==='' && f==='');
}

function saveReading(){
  const date=document.getElementById('log-date').value;
  const time=document.getElementById('log-t').value||null;
  const notes=document.getElementById('log-notes').value.trim();
  const pef=parseFloat(document.getElementById('log-pef').value);
  const fev1=parseFloat(document.getElementById('log-fev1').value);
  if(!date){toast('Please set a date','error');return;}
  if(isNaN(pef)&&isNaN(fev1)){toast('Enter at least one reading','error');return;}
  const r={id:Date.now(),date,time,notes,pef:isNaN(pef)?null:pef,fev1:isNaN(fev1)?null:fev1};
  const s=getRecs(); s.push(r);
  s.sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  saveRecs(s); toast('Reading saved','success'); clearLog(); showTab('history');
}

function clearLog(){
  const n=new Date();
  document.getElementById('log-date').value=ds(n);
  const hh=n.getHours(), mm=String(n.getMinutes()).padStart(2,'0');
  document.getElementById('log-t').value=String(hh).padStart(2,'0')+':'+mm;
  document.getElementById('log-td').textContent=String(hh%12||12).padStart(2,'0')+':'+mm+' '+(hh>=12?'PM':'AM');
  ['log-pef','log-fev1'].forEach(id=>{document.getElementById(id).value='';document.getElementById(id).classList.remove('fp','ff');});
  document.getElementById('log-notes').value='';
  document.getElementById('log-save').disabled=true;
  nudge();
}

function nudge(){
  const el=document.getElementById('nudge'), s=getRecs(), today=ds(new Date());
  if(s.some(r=>r.date===today)){el.textContent='Reading logged today';el.className='nudge ok';}
  else if(s.length){const l=s[s.length-1],d=Math.floor((new Date()-new Date(l.date))/86400000);el.textContent='Last logged '+(d===1?'yesterday':d+' days ago')+' -- reading due';el.className='nudge due';}
  else{el.textContent='Log your first peak flow reading';el.className='nudge none';}
}

// ── HISTORY ──
const SVG_E='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A5E72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
const SVG_D='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A5E72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';

function renderHistory(){
  const el=document.getElementById('hcontent'), s=getRecs();
  if(!s.length){el.innerHTML='<div class="empty"><div class="empty-icon">&#128203;</div><div class="empty-ttl">No readings yet</div><div class="empty-sub">Log your first peak flow reading to see it here.</div></div>';return;}
  el.innerHTML=[...s].reverse().map(r=>`
  <div class="hcard" id="hc-${r.id}">
    <div class="hcard-top">
      <div class="hcard-date">
        <div class="hcard-date-main">${fd(r.date)}</div>
        <div class="hcard-date-sub">${r.time?ft(r.time):'No time set'}</div>
      </div>
      <div class="hcard-btns">
        <button class="ib e" onclick="openEdit(${r.id})" title="Edit">${SVG_E}</button>
        <button class="ib d" onclick="confirmDel(${r.id})" title="Delete">${SVG_D}</button>
      </div>
    </div>
    <div class="hcard-vals">
      <div class="hval">
        <div class="hval-lbl p">PEF</div>
        ${r.pef!=null?`<span class="hval-num p">${r.pef}<span class="hval-unit">L/min</span></span>`:'<span class="hval-none">--</span>'}
      </div>
      <div class="hval">
        <div class="hval-lbl f">FEV1</div>
        ${r.fev1!=null?`<span class="hval-num f">${r.fev1}<span class="hval-unit">L</span></span>`:'<span class="hval-none">--</span>'}
      </div>
    </div>
    ${r.notes?`<div class="hcard-notes">${r.notes}</div>`:''}
  </div>`).join('');
}

function confirmDel(id){
  const card=document.getElementById('hc-'+id);
  if(card.querySelector('.del-bar')){card.querySelector('.del-bar').remove();return;}
  const b=document.createElement('div');b.className='del-bar';
  b.innerHTML=`<span>Delete this reading?</span>
    <button class="btn btn-sm" style="background:var(--danger);color:#fff;border:none" onclick="doDel(${id})">Delete</button>
    <button class="btn btn-ghost btn-sm" onclick="this.parentElement.remove()">Cancel</button>`;
  card.appendChild(b);
}
function doDel(id){saveRecs(getRecs().filter(r=>r.id!==id));renderHistory();toast('Reading deleted');}

// ── EDIT ──
let _eid=null;
function openEdit(id){
  const r=getRecs().find(s=>s.id===id); if(!r)return; _eid=id;
  document.getElementById('edit-date').value=r.date;
  document.getElementById('edit-t').value=r.time||'';
  document.getElementById('edit-pef').value=r.pef??'';
  document.getElementById('edit-fev1').value=r.fev1??'';
  document.getElementById('edit-notes').value=r.notes||'';
  if(r.time){const[hh,mm]=r.time.split(':'),h=parseInt(hh);document.getElementById('edit-td').textContent=String(h%12||12).padStart(2,'0')+':'+mm+' '+(h>=12?'PM':'AM');}
  else{document.getElementById('edit-td').textContent='Tap to set';}
  document.getElementById('em').classList.add('open');
}
function closeEdit(){document.getElementById('em').classList.remove('open');}
function saveEdit(){
  const date=document.getElementById('edit-date').value;
  const time=document.getElementById('edit-t').value||null;
  const notes=document.getElementById('edit-notes').value.trim();
  const pef=parseFloat(document.getElementById('edit-pef').value);
  const fev1=parseFloat(document.getElementById('edit-fev1').value);
  if(!date){toast('Date is required','error');return;}
  if(isNaN(pef)&&isNaN(fev1)){toast('Enter at least one reading','error');return;}
  const s=getRecs(), idx=s.findIndex(r=>r.id===_eid);
  if(idx===-1){toast('Not found','error');return;}
  s[idx]={...s[idx],date,time,notes,pef:isNaN(pef)?null:pef,fev1:isNaN(fev1)?null:fev1};
  s.sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  console.log('[PF] saveEdit: saving id='+_eid+' date='+date);
  console.log('[PF] full array:', JSON.stringify(s.map(r=>({id:r.id,date:r.date}))));
  saveRecs(s);
  console.log('[PF] localStorage after save:', JSON.stringify(getRecs().map(r=>({id:r.id,date:r.date}))));
  closeEdit(); renderHistory(); toast('Reading updated','success');
}

// ── TRENDS ──
let _ch=null;
function renderTrends(){
  const el=document.getElementById('tcontent'), s=getRecs();
  if(s.length<2){el.innerHTML='<div class="empty"><div class="empty-icon">&#128200;</div><div class="empty-ttl">Not enough data</div><div class="empty-sub">Log at least 2 readings to see trends.</div></div>';return;}
  const sorted=[...s].sort((a,b)=>a.date.localeCompare(b.date));
  const lbls=sorted.map(r=>fds(r.date));
  const pefs=sorted.map(r=>r.pef??null), fev1s=sorted.map(r=>r.fev1??null);
  const vp=pefs.filter(v=>v!=null), vf=fev1s.filter(v=>v!=null);
  const lp=vp.at(-1)??null, lf=vf.at(-1)??null;
  const ap=vp.length?(vp.reduce((a,b)=>a+b,0)/vp.length).toFixed(0):null;
  const af=vf.length?(vf.reduce((a,b)=>a+b,0)/vf.length).toFixed(2):null;
  el.innerHTML=`
  <div class="stats-grid">
    <div class="scard"><div class="scard-eye">Latest PEF</div><div class="scard-val b">${lp??'--'}<span style="font-size:13px;color:var(--ink3);margin-left:3px">${lp!=null?'L/min':''}</span></div><div class="scard-sub">avg ${ap??'--'} L/min</div></div>
    <div class="scard"><div class="scard-eye">Latest FEV1</div><div class="scard-val g">${lf??'--'}<span style="font-size:13px;color:var(--ink3);margin-left:3px">${lf!=null?'L':''}</span></div><div class="scard-sub">avg ${af??'--'} L</div></div>
    <div class="scard"><div class="scard-eye">Best PEF</div><div class="scard-val b">${vp.length?Math.max(...vp):'--'}<span style="font-size:13px;color:var(--ink3);margin-left:3px">${vp.length?'L/min':''}</span></div><div class="scard-sub">all time</div></div>
    <div class="scard"><div class="scard-eye">Best FEV1</div><div class="scard-val g">${vf.length?Math.max(...vf):'--'}<span style="font-size:13px;color:var(--ink3);margin-left:3px">${vf.length?'L':''}</span></div><div class="scard-sub">all time</div></div>
  </div>
  <div class="chart-card"><div class="chart-ttl">PEF &amp; FEV1 Over Time</div><div class="chart-wrap"><canvas id="pfc"></canvas></div></div>`;
  if(_ch){_ch.destroy();_ch=null;}
  const ds2=[];
  if(pefs.some(v=>v!=null))ds2.push({label:'PEF (L/min)',data:pefs,yAxisID:'yP',borderColor:'#3B82C4',backgroundColor:'rgba(59,130,196,.08)',borderWidth:2.5,pointBackgroundColor:'#3B82C4',pointRadius:4,fill:true,tension:.3,spanGaps:true});
  if(fev1s.some(v=>v!=null))ds2.push({label:'FEV1 (L)',data:fev1s,yAxisID:'yF',borderColor:'#2D9E6B',backgroundColor:'rgba(45,158,107,.08)',borderWidth:2.5,pointBackgroundColor:'#2D9E6B',pointRadius:4,fill:true,tension:.3,spanGaps:true});
  setTimeout(() => {
    _ch = new Chart(document.getElementById('pfc'), {
      type: 'line',
      data: { labels: lbls, datasets: ds2 },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: true, labels: { font: { family: 'DM Sans', size: 11 }, color: '#4A5E72', usePointStyle: true, pointStyle: 'line', boxWidth: 28, padding: 12 } },
          tooltip: { mode: 'index', intersect: false }
        },
        scales: {
          x:  { grid: { color: '#E8EFF5' }, ticks: { font: { family: 'DM Mono', size: 9 }, color: '#8A9EAF', maxTicksLimit: 10 } },
          yP: { type: 'linear', position: 'left',  grid: { color: '#E8EFF5' }, ticks: { font: { family: 'DM Mono', size: 10 }, color: '#3B82C4' }, title: { display: true, text: 'PEF (L/min)', color: '#3B82C4', font: { size: 10 } } },
          yF: { type: 'linear', position: 'right', grid: { drawOnChartArea: false }, ticks: { font: { family: 'DM Mono', size: 10 }, color: '#2D9E6B' }, title: { display: true, text: 'FEV1 (L)', color: '#2D9E6B', font: { size: 10 } } }
        }
      }
    });
  }, 50);
}

// ── TIME PICKER ──
let _th=12,_tm=0,_tap='AM',_tt='log',_tr=null;
function openTP(t){
  _tt=t; const v=document.getElementById(t===('log')?'log-t':'edit-t').value;
  if(v){const[hh,mm]=v.split(':');_th=parseInt(hh)%12||12;_tm=parseInt(mm);_tap=parseInt(hh)>=12?'PM':'AM';}
  else{const n=new Date();_th=n.getHours()%12||12;_tm=n.getMinutes();_tap=n.getHours()>=12?'PM':'AM';}
  rTP(); document.getElementById('tp-modal').classList.add('open');
}
function closeTP(){document.getElementById('tp-modal').classList.remove('open');}
function rTP(){document.getElementById('tph').textContent=String(_th).padStart(2,'0');document.getElementById('tpm').textContent=String(_tm).padStart(2,'0');document.getElementById('tpam').classList.toggle('active',_tap==='AM');document.getElementById('tppm').classList.toggle('active',_tap==='PM');}
function nTP(f,d){if(f==='h')_th=(_th-1+d+12)%12+1;if(f==='m')_tm=(_tm+d+60)%60;rTP();}
function sR(f,d){nTP(f,d);eR();_tr=setInterval(()=>nTP(f,d),130);}
function eR(){if(_tr){clearInterval(_tr);_tr=null;}}
function setAP(v){_tap=v;rTP();}
function confirmTP(){
  let h24=_th%12; if(_tap==='PM')h24+=12;
  const ts=String(h24).padStart(2,'0')+':'+String(_tm).padStart(2,'0');
  const disp=String(_th).padStart(2,'0')+':'+String(_tm).padStart(2,'0')+' '+_tap;
  const tKey=_tt==='log'?'log-t':'edit-t', dKey=_tt==='log'?'log-td':'edit-td';
  document.getElementById(tKey).value=ts;
  document.getElementById(dKey).textContent=disp;
  closeTP();
}

// ── TABS ──
function showTab(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='history')renderHistory();
  if(name==='trends')renderTrends();
  if(name==='log')nudge();
}

// ── EXPORT ──
function doExport(){
  const s=getRecs(); if(!s.length){toast('No data','error');return;}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));
  a.download='peak_flow_'+ds(new Date())+'.json'; a.click(); toast('Exported','success');
}

// ── UTILS ──
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fd(d){const[y,m,day]=d.split('-');return m+'/'+day+'/'+y;}
function fds(d){const[y,m,day]=d.split('-');return m+'/'+day;}
function ft(t){const[h,m]=t.split(':'),hh=parseInt(h);return(hh%12||12)+':'+m+' '+(hh>=12?'PM':'AM');}
function toast(msg,type=''){const el=document.getElementById('toast');el.textContent=msg;el.className='toast show'+(type?' '+type:'');setTimeout(()=>el.className='toast',2800);}

// ── INIT ──
// Block execution if Chrome is prerendering this page in the background.
// Prerendered pages have an isolated localStorage — running init here would
// read stale data and the save on the real page would be lost.
async function runInit() {
  const local = getRecs();
  if(!local.length){
    // localStorage empty — seed from Supabase
    try{
      const remote = await syncLoadClinical('peak_flow');
      if(remote && Array.isArray(remote) && remote.length){
        localStorage.setItem(KEY, JSON.stringify(remote));
        toast('Loaded ' + remote.length + ' records from cloud');
      } else {
        toast('No cloud data found','error');
      }
    }catch(e){ toast('Cloud load failed: ' + e.message,'error'); }
  } else {
    toast('Loaded ' + local.length + ' local records');
    console.log('[PF] INIT from localStorage:', JSON.stringify(local.map(r=>({id:r.id,date:r.date}))));
  }
  clearLog();
  nudge();
  if(document.getElementById('tab-history').classList.contains('active')) renderHistory();
}

// If prerendering, wait for activation before running init
if (document.prerendering) {
  document.addEventListener('prerenderingchange', () => { if (!document.prerendering) runInit(); }, { once: true });
} else {
  runInit();
}
</script>
