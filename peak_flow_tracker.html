<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peak Flow Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg:        #F0F4F8;
    --surface:   #FFFFFF;
    --surface2:  #E8EFF5;
    --border:    #D0DCE8;
    --ink:       #1A2533;
    --ink2:      #4A5E72;
    --ink3:      #8A9EAF;
    --accent:    #3B82C4;
    --accent2:   #E8F1FA;
    --good:      #2D9E6B;
    --good-bg:   #E8F7F1;
    --warn:      #E07B39;
    --warn-bg:   #FDF0E8;
    --danger:    #C94040;
    --danger-bg: #FAEAEA;
    --radius:    12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    font-size: 15px;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo { display: flex; align-items: baseline; gap: 10px; }
  .logo-title { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--ink); letter-spacing: -0.3px; }
  .logo-sub { font-size: 12px; color: var(--ink3); font-weight: 400; letter-spacing: 0.5px; text-transform: uppercase; }

  /* ── TABS ── */
  .tabs {
    display: flex;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
  }
  .tab {
    padding: 12px 18px;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink2);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    background: none;
    border-top: none; border-left: none; border-right: none;
  }
  .tab:hover { color: var(--accent); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ── LAYOUT ── */
  .page { display: none; padding: 24px; max-width: 600px; margin: 0 auto; }
  .page.active { display: block; }

  /* ── CARDS ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 16px;
  }
  .card-title {
    font-family: 'DM Serif Display', serif;
    font-size: 16px;
    color: var(--ink);
    margin-bottom: 16px;
    letter-spacing: -0.2px;
  }

  /* ── FORM ── */
  .form-row { display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .form-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 130px; }
  label { font-size: 12px; font-weight: 500; color: var(--ink2); letter-spacing: 0.3px; text-transform: uppercase; }
  input[type="date"], input[type="text"], textarea {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 9px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--ink);
    transition: border-color 0.15s;
    width: 100%;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,196,0.1); }
  textarea { resize: vertical; min-height: 64px; }

  /* ── BLOW INPUTS ── */
  .blows-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  .blow-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .blow-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--ink3);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .blow-input-wrap { position: relative; width: 100%; }
  .blow-input {
    width: 100%;
    text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 28px;
    font-weight: 500;
    padding: 14px 8px;
    border-radius: var(--radius);
    border: 2px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    transition: all 0.15s;
    -moz-appearance: textfield;
  }
  .blow-input::-webkit-outer-spin-button,
  .blow-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .blow-input:focus { outline: none; border-color: var(--accent); background: var(--accent2); box-shadow: 0 0 0 3px rgba(59,130,196,0.1); }
  .blow-input.filled { border-color: var(--good); background: var(--good-bg); color: var(--good); }
  .blow-input.best { border-color: var(--good); background: var(--good); color: #fff; }
  .blow-badge {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--ink3);
    height: 16px;
  }
  .blow-badge.best-badge { color: var(--good); }

  /* ── BEST READING DISPLAY ── */
  .best-display {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--good-bg);
    border: 1px solid #a8dfc5;
    border-radius: var(--radius);
    padding: 14px 20px;
    margin-bottom: 16px;
  }
  .best-label { font-size: 12px; font-weight: 600; color: var(--good); text-transform: uppercase; letter-spacing: 0.5px; }
  .best-val { font-family: 'DM Mono', monospace; font-size: 42px; font-weight: 500; color: var(--good); line-height: 1; }
  .best-unit { font-size: 13px; color: var(--good); opacity: 0.7; margin-top: 2px; }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 18px; border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
    cursor: pointer; border: none; transition: all 0.15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #2d6faa; }
  .btn-primary:disabled { background: var(--border); color: var(--ink3); cursor: not-allowed; }
  .btn-ghost { background: none; border: 1px solid var(--border); color: var(--ink2); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); background: var(--accent2); }
  .btn-danger-soft { background: var(--danger-bg); color: var(--danger); border: 1px solid #f0c0c0; }
  .btn-sm { padding: 6px 12px; font-size: 12px; }

  /* ── HISTORY CARDS ── */
  .hist-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
  }
  .hist-top {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  .hist-date-block { flex: 1; }
  .hist-date { font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; color: var(--ink); }
  .hist-time-text { font-size: 12px; color: var(--ink3); margin-top: 2px; }
  .hist-best {
    font-family: 'DM Mono', monospace;
    font-size: 36px;
    font-weight: 500;
    color: var(--good);
    line-height: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
  }
  .hist-best-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink3); font-family: 'DM Sans', sans-serif; margin-top: 2px; }
  .hist-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg);
    font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; -webkit-tap-highlight-color: transparent;
  }
  .icon-btn:active { background: var(--surface2); }
  .hist-blows {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    padding: 10px 16px;
    gap: 8px;
  }
  .hist-blow { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .hist-blow-val { font-family: 'DM Mono', monospace; font-size: 18px; font-weight: 500; color: var(--ink2); }
  .hist-blow-val.is-best { color: var(--good); font-size: 20px; }
  .hist-blow-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--ink3); margin-top: 2px; }
  .hist-notes { padding: 8px 16px 12px; font-size: 12px; color: var(--ink3); font-style: italic; border-top: 1px solid var(--border); }
  .del-confirm {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; background: var(--danger-bg);
    border-top: 1px solid #f0c0c0; flex-wrap: wrap;
  }

  /* ── TREND CHARTS ── */
  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px;
  }
  .stat-eyebrow { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--ink3); margin-bottom: 4px; }
  .stat-val { font-family: 'DM Mono', monospace; font-size: 26px; font-weight: 500; color: var(--ink); line-height: 1; }
  .stat-val.good { color: var(--good); }
  .stat-sub { font-size: 11px; color: var(--ink3); margin-top: 3px; }
  .chart-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px;
  }
  .chart-title { font-size: 12px; font-weight: 600; color: var(--ink2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; }
  .chart-wrap { position: relative; height: 200px; }

  /* ── TIME PICKER ── */
  .time-picker-modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 300;
    align-items: flex-end; justify-content: center;
  }
  .time-picker-modal.open { display: flex; }
  .time-picker-sheet {
    background: var(--surface); border-radius: 20px 20px 0 0;
    padding: 24px 24px 36px; width: 100%; max-width: 480px;
  }
  .time-picker-title { font-family: 'DM Serif Display', serif; font-size: 17px; color: var(--ink); margin-bottom: 20px; text-align: center; }
  .time-picker-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 24px; }
  .time-scroll { display: flex; flex-direction: column; align-items: center; }
  .time-scroll-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink3); margin-bottom: 6px; }
  .time-scroll button { background: none; border: none; font-size: 22px; color: var(--ink3); cursor: pointer; padding: 4px 12px; border-radius: 6px; line-height: 1; }
  .time-scroll button:active { background: var(--surface2); }
  .time-val { font-family: 'DM Mono', monospace; font-size: 42px; font-weight: 500; color: var(--ink); min-width: 64px; text-align: center; background: var(--bg); border-radius: 10px; padding: 8px 12px; line-height: 1; }
  .time-sep { font-family: 'DM Mono', monospace; font-size: 36px; color: var(--ink2); margin-bottom: 20px; }
  .ampm-toggle { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; margin-left: 8px; margin-top: 20px; }
  .ampm-btn { padding: 10px 18px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); font-size: 14px; font-weight: 600; cursor: pointer; color: var(--ink2); transition: all 0.15s; }
  .ampm-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .time-picker-actions { display: flex; gap: 10px; }

  /* ── EDIT MODAL ── */
  .edit-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300; align-items: flex-end; justify-content: center; }
  .edit-sheet { background: var(--surface); border-radius: 20px 20px 0 0; padding: 24px 20px 36px; width: 100%; max-width: 480px; }
  .edit-title { font-family: 'DM Serif Display', serif; font-size: 18px; color: var(--ink); margin-bottom: 18px; }
  .edit-blows { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 14px; }
  .edit-blow-group { display: flex; flex-direction: column; gap: 5px; }
  .edit-blow-input {
    text-align: center; font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 500;
    padding: 10px 8px; border-radius: var(--radius-sm); border: 2px solid var(--border);
    background: var(--bg); color: var(--ink); width: 100%;
    -moz-appearance: textfield;
  }
  .edit-blow-input::-webkit-outer-spin-button,
  .edit-blow-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .edit-blow-input:focus { outline: none; border-color: var(--accent); }

  /* ── MISC ── */
  .empty { text-align: center; padding: 48px 24px; color: var(--ink3); }
  .empty-icon { font-size: 36px; margin-bottom: 12px; }
  .empty-title { font-family: 'DM Serif Display', serif; font-size: 18px; color: var(--ink2); margin-bottom: 6px; }
  .empty-sub { font-size: 13px; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--ink); color: #fff; padding: 12px 20px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; z-index: 999; opacity: 0; transform: translateY(8px); transition: all 0.2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { background: var(--good); }
  .toast.error { background: var(--danger); }
  .divider { height: 1px; background: var(--border); margin: 16px 0; }
  .header-actions { display: flex; gap: 10px; align-items: center; }

  @media (max-width: 480px) {
    .page { padding: 16px; }
    header { padding: 0 16px; }
    .tabs { padding: 0 12px; }
    .stat-row { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-title">Peak Flow</span>
    <span class="logo-sub">FEV1 Surveillance</span>
  </div>
  <div class="header-actions">
    <button class="btn btn-ghost btn-sm" onclick="exportData()">↓ Export</button>
    <button class="btn btn-primary btn-sm" onclick="showTab('log')">+ New Reading</button>
  </div>
</header>

<div class="tabs">
  <button class="tab active" onclick="showTab('log')" id="tab-log">Log Reading</button>
  <button class="tab" onclick="showTab('history')" id="tab-history">History</button>
  <button class="tab" onclick="showTab('trends')" id="tab-trends">Trends</button>
</div>

<!-- ═══════════════════════
     LOG READING
═══════════════════════ -->
<div class="page active" id="page-log">

  <div class="card">
    <div class="card-title">Session Details</div>
    <div class="form-row">
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="sessionDate">
      </div>
      <div class="form-group">
        <label>Time</label>
        <div id="timeDisplay" onclick="openTimePicker()"
          style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:14px;color:var(--ink);cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:space-between;-webkit-tap-highlight-color:transparent;">
          <span id="timeDisplayText">Tap to set time</span>
          <span style="color:var(--ink3);font-size:16px">🕐</span>
        </div>
        <input type="hidden" id="sessionTime">
      </div>
    </div>
    <div class="form-group">
      <label>Notes / Symptoms</label>
      <textarea id="sessionNotes" placeholder="e.g. felt good, slight shortness of breath…"></textarea>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Session Reading</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:16px">
      <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink3)">Max Value — Best Effort</div>
      <div style="display:flex;align-items:center;gap:12px">
        <input type="number" class="blow-input" id="blow1" min="0" max="10000" step="1"
          placeholder="—" oninput="onBlowInput()"
          style="width:190px;font-size:52px;text-align:center">
        <span style="font-family:'DM Mono',monospace;font-size:22px;color:var(--ink3)">mL</span>
      </div>
      <div style="font-size:12px;color:var(--ink3);text-align:center;line-height:1.5">
        Enter the highest value shown on your FEV1 device for this session
      </div>
    </div>
  </div>

  <div style="display:flex;gap:10px;justify-content:flex-end">
    <button class="btn btn-ghost" onclick="clearForm()">Clear</button>
    <button class="btn btn-primary" id="saveBtn" onclick="saveSession()" disabled>Save Reading</button>
  </div>
</div>

<!-- ═══════════════════════
     HISTORY
═══════════════════════ -->
<div class="page" id="page-history">
  <div id="historyContent"></div>
</div>

<!-- ═══════════════════════
     TRENDS
═══════════════════════ -->
<div class="page" id="page-trends">
  <div id="trendsContent"></div>
</div>

<!-- Time Picker -->
<div class="time-picker-modal" id="timePickerModal" onclick="if(event.target===this)closeTimePicker()">
  <div class="time-picker-sheet">
    <div class="time-picker-title">Set Reading Time</div>
    <div class="time-picker-row">
      <div class="time-scroll">
        <div class="time-scroll-label">Hour</div>
        <button ontouchstart="startRepeat('hour',1)" onmousedown="startRepeat('hour',1)" ontouchend="stopRepeat()" onmouseup="stopRepeat()">▲</button>
        <div class="time-val" id="tpHour">12</div>
        <button ontouchstart="startRepeat('hour',-1)" onmousedown="startRepeat('hour',-1)" ontouchend="stopRepeat()" onmouseup="stopRepeat()">▼</button>
      </div>
      <div class="time-sep">:</div>
      <div class="time-scroll">
        <div class="time-scroll-label">Min</div>
        <button ontouchstart="startRepeat('min',1)" onmousedown="startRepeat('min',1)" ontouchend="stopRepeat()" onmouseup="stopRepeat()">▲</button>
        <div class="time-val" id="tpMin">00</div>
        <button ontouchstart="startRepeat('min',-1)" onmousedown="startRepeat('min',-1)" ontouchend="stopRepeat()" onmouseup="stopRepeat()">▼</button>
      </div>
      <div class="ampm-toggle">
        <button class="ampm-btn active" id="tpAM" onclick="setAmPm('AM')">AM</button>
        <button class="ampm-btn" id="tpPM" onclick="setAmPm('PM')">PM</button>
      </div>
    </div>
    <div class="time-picker-actions">
      <button class="btn btn-ghost" style="flex:1" onclick="closeTimePicker()">Cancel</button>
      <button class="btn btn-primary" style="flex:2" onclick="confirmTime()">OK — Set Time</button>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="edit-modal" id="editModal" onclick="if(event.target===this)this.style.display='none'">
  <div class="edit-sheet">
    <div class="edit-title">Edit Reading</div>
    <div class="form-row">
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="editDate">
      </div>
      <div class="form-group">
        <label>Time</label>
        <div id="editTimeDisplay" onclick="openEditTimePicker()"
          style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:14px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:space-between;">
          <span id="editTimeText">Tap to set time</span>
          <span style="color:var(--ink3)">🕐</span>
        </div>
        <input type="hidden" id="editTime">
      </div>
    </div>
    <div style="margin-bottom:14px">
      <label style="display:block;margin-bottom:6px;font-size:12px;font-weight:500;color:var(--ink2);letter-spacing:0.3px;text-transform:uppercase">Blow Readings</label>
      <div style="margin-bottom:14px">
        <label style="display:block;text-transform:uppercase;font-size:10px;letter-spacing:0.4px;color:var(--ink3);margin-bottom:6px">Max Value (mL)</label>
        <input type="number" class="edit-blow-input" id="editBlow1" min="0" max="10000" style="font-size:22px;text-align:center;width:100%;padding:10px;border:2px solid var(--border);border-radius:8px;background:var(--bg);font-family:'DM Mono',monospace;-moz-appearance:textfield">
      </div>
    </div>
    <div class="form-group" style="margin-bottom:18px">
      <label>Notes / Symptoms</label>
      <textarea id="editNotes" placeholder="e.g. felt good, slight shortness of breath…"></textarea>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-ghost" style="flex:1" onclick="document.getElementById('editModal').style.display='none'">Cancel</button>
      <button class="btn btn-primary" style="flex:2" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════
//  STORAGE
// ══════════════════════════════════════════════════
const STORAGE_KEY = 'peak_flow_sessions_v1';
function getSessions() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch(e) { return []; }
}
function saveSessions(s) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
  syncSaveClinical('peak_flow', s).then(()=>syncShowStatus('synced')).catch(()=>syncShowStatus('error'));
}

// ══════════════════════════════════════════════════
//  BLOW INPUT LOGIC
// ══════════════════════════════════════════════════
function getBlows() {
  const v = parseFloat(document.getElementById('blow1').value);
  return [isNaN(v) ? null : v, null, null];
}

function onBlowInput() {
  const inp = document.getElementById('blow1');
  const val = parseFloat(inp.value);
  const hasVal = inp.value !== '' && !isNaN(val);
  inp.classList.toggle('filled', hasVal);
  document.getElementById('saveBtn').disabled = !hasVal;
}

// ══════════════════════════════════════════════════
//  SAVE SESSION
// ══════════════════════════════════════════════════
function saveSession() {
  const date  = document.getElementById('sessionDate').value;
  const time  = document.getElementById('sessionTime').value;
  const notes = document.getElementById('sessionNotes').value.trim();
  const val   = parseFloat(document.getElementById('blow1').value);

  if (!date) { showToast('Please set a date', 'error'); return; }
  if (isNaN(val)) { showToast('Enter a reading', 'error'); return; }

  const session = {
    id: Date.now(),
    date, time: time || null, notes,
    blows: [val, null, null],
    best: val, avg: val
  };

  const sessions = getSessions();
  sessions.push(session);
  sessions.sort((a,b) => a.date.localeCompare(b.date) || (a.time||'').localeCompare(b.time||''));
  saveSessions(sessions);
  showToast('Reading saved ✓', 'success');
  clearForm();
  showTab('history');
}

function clearForm() {
  document.getElementById('sessionDate').value = '';
  document.getElementById('sessionTime').value = '';
  document.getElementById('timeDisplayText').textContent = 'Tap to set time';
  document.getElementById('sessionNotes').value = '';
  const inp = document.getElementById('blow1');
  if (inp) { inp.value = ''; inp.classList.remove('filled','best'); }
  document.getElementById('saveBtn').disabled = true;
  initDateTime();
}

// ══════════════════════════════════════════════════
//  HISTORY
// ══════════════════════════════════════════════════
function renderHistory() {
  const sessions = getSessions();
  const el = document.getElementById('historyContent');

  if (!sessions.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">No readings yet</div><div class="empty-sub">Log your first peak flow reading to see it here.</div></div>`;
    return;
  }

  el.innerHTML = [...sessions].reverse().map(s => {
    const bestIdx = s.blows.indexOf(s.best);
    return `
    <div class="hist-card" id="hcard-${s.id}">
      <div class="hist-top">
        <div class="hist-date-block">
          <div class="hist-date">${formatDate(s.date)}</div>
          <div class="hist-time-text">${s.time ? formatTime(s.time) : 'No time set'}</div>
        </div>
        <div class="hist-best">${s.avg}<span class="hist-best-label">Avg</span></div>
        <div class="hist-actions">
          <button class="icon-btn" onclick="openEditModal(${s.id})" title="Edit">✏️</button>
          <button class="icon-btn" onclick="confirmDelete(${s.id})" title="Delete">🗑️</button>
        </div>
      </div>
      <div style="padding:10px 16px 14px;text-align:center">
        <div style="font-family:'DM Mono',monospace;font-size:32px;font-weight:500;color:var(--good)">${s.best}</div>
        <div style="font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:0.4px;margin-top:3px">mL — Max Value</div>
      </div>
      ${s.notes ? `<div class="hist-notes">${s.notes}</div>` : ''}
    </div>`;
  }).join('');
}

function confirmDelete(id) {
  const card = document.getElementById('hcard-' + id);
  const existing = card.querySelector('.del-confirm');
  if (existing) { existing.remove(); return; }
  const bar = document.createElement('div');
  bar.className = 'del-confirm';
  bar.innerHTML = `<span style="font-size:13px;color:var(--danger)">Delete this reading?</span>
    <button class="btn btn-danger-soft btn-sm" onclick="deleteSession(${id})">Yes, delete</button>
    <button class="btn btn-ghost btn-sm" onclick="this.parentElement.remove()">Cancel</button>`;
  card.appendChild(bar);
}

function deleteSession(id) {
  saveSessions(getSessions().filter(s => s.id !== id));
  renderHistory();
  showToast('Reading deleted');
}

// ── Edit ──
let editingId = null;

function openEditModal(id) {
  const s = getSessions().find(x => x.id === id);
  if (!s) return;
  editingId = id;
  document.getElementById('editDate').value = s.date;
  document.getElementById('editTime').value = s.time || '';
  document.getElementById('editBlow1').value = s.best ?? '';
  document.getElementById('editNotes').value = s.notes || '';
  if (s.time) {
    const [hh,mm] = s.time.split(':');
    const h = parseInt(hh), m = parseInt(mm);
    const h12 = h%12||12, ampm = h>=12?'PM':'AM';
    document.getElementById('editTimeText').textContent = String(h12).padStart(2,'0')+':'+String(m).padStart(2,'0')+' '+ampm;
  } else {
    document.getElementById('editTimeText').textContent = 'Tap to set time';
  }
  document.getElementById('editModal').style.display = 'flex';
}

function saveEdit() {
  const date  = document.getElementById('editDate').value;
  const time  = document.getElementById('editTime').value;
  const notes = document.getElementById('editNotes').value.trim();
  const editVal = parseFloat(document.getElementById('editBlow1').value);
  if (!date) { showToast('Date is required', 'error'); return; }
  if (isNaN(editVal)) { showToast('Reading is required', 'error'); return; }

  const sessions = getSessions();
  const idx = sessions.findIndex(s => s.id === editingId);
  if (idx === -1) return;
  sessions[idx] = { ...sessions[idx], date, time: time||null, notes, blows: [editVal, null, null], best: editVal, avg: editVal };
  sessions.sort((a,b) => a.date.localeCompare(b.date));
  saveSessions(sessions);
  document.getElementById('editModal').style.display = 'none';
  renderHistory();
  showToast('Reading updated ✓', 'success');
}

// ══════════════════════════════════════════════════
//  TRENDS
// ══════════════════════════════════════════════════
let trendCharts = {};

function renderTrends() {
  const sessions = getSessions();
  const el = document.getElementById('trendsContent');

  if (sessions.length < 2) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">📈</div><div class="empty-title">Not enough data yet</div><div class="empty-sub">Log at least 2 readings to see trends.</div></div>`;
    return;
  }

  Object.values(trendCharts).forEach(c => c.destroy());
  trendCharts = {};

  const sorted = [...sessions].sort((a,b) => a.date.localeCompare(b.date));
  const labels = sorted.map(s => formatDateShort(s.date));
  const bests  = sorted.map(s => s.best); // kept for reference
  const avgs   = sorted.map(s => s.avg);

  const allBest = Math.max(...avgs);
  const allAvg  = (avgs.reduce((a,b)=>a+b,0)/avgs.length).toFixed(1);
  const recent3 = avgs.slice(-3);
  const first3  = avgs.slice(0,3);
  const trend = recent3.reduce((a,b)=>a+b,0)/recent3.length - first3.reduce((a,b)=>a+b,0)/first3.length;
  const trendTxt = bests.length < 6 ? '' : trend > 2 ? '↑ improving' : trend < -2 ? '↓ declining' : '→ stable';
  const trendColor = trend > 2 ? 'good' : trend < -2 ? 'danger' : '';

  // Latest reading vs accumulated average
  const latestAvg = avgs[avgs.length - 1];
  const accumAvg  = parseFloat((avgs.reduce((a,b) => a+b, 0) / avgs.length).toFixed(1));
  const vsAccum   = parseFloat(((latestAvg - accumAvg) / accumAvg * 100).toFixed(1));
  const vsSign    = vsAccum >= 0 ? '+' : '';
  const isBigDrop = vsAccum <= -10;
  const isBigRise = vsAccum >= 10;
  const vsColor   = isBigDrop ? '#C94040' : isBigRise ? '#2D9E6B' : '#4A5E72';
  const vsBg      = isBigDrop ? '#FAEAEA' : isBigRise ? '#E8F7F1' : '#F0F4F8';
  const vsBorder  = isBigDrop ? '#f0c0c0' : isBigRise ? '#a8dfc5' : '#D0DCE8';
  const vsNote    = isBigDrop ? '⚠️ Significant drop' : isBigRise ? '✅ Significant rise' : 'vs accumulated avg';

  const latestColor = isBigDrop ? '#C94040' : isBigRise ? '#2D9E6B' : 'var(--ink)';

  el.innerHTML = `
    <div class="stat-row" style="grid-template-columns: repeat(2, 1fr)">
      <div class="stat-card">
        <div class="stat-eyebrow">Latest Reading</div>
        <div class="stat-val" style="color:${latestColor}">${latestAvg}</div>
        <div class="stat-sub" style="color:${latestColor};font-weight:500">${vsSign}${vsAccum}% vs avg</div>
      </div>
      <div class="stat-card">
        <div class="stat-eyebrow">Running Avg</div>
        <div class="stat-val">${allAvg}</div>
        <div class="stat-sub">${trendTxt ? `<span style="font-size:13px;font-weight:500;color:${trendColor === 'good' ? '#2D9E6B' : trendColor === 'danger' ? '#C94040' : '#8A9EAF'}">${trendTxt}</span>` : 'all sessions'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-eyebrow">Best Session</div>
        <div class="stat-val good">${Math.max(...avgs)}</div>
        <div class="stat-sub">peak flow</div>
      </div>
      <div class="stat-card">
        <div class="stat-eyebrow">Sessions</div>
        <div class="stat-val">${sessions.length}</div>
        <div class="stat-sub">logged</div>
      </div>
    </div>

    <div style="background:${vsBg};border:1px solid ${vsBorder};border-radius:12px;padding:14px 20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;">
      <div>
        <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:${vsColor};margin-bottom:3px">Latest vs Accumulated Avg</div>
        <div style="font-size:12px;color:#4A5E72">${vsNote}</div>
      </div>
      <div style="font-family:'DM Mono',monospace;font-size:36px;font-weight:500;color:${vsColor};line-height:1">${vsSign}${vsAccum}%</div>
    </div>

    <div class="chart-card">
      <div class="chart-title">FEV1 Max Value per Session (mL)</div>
      <div class="chart-wrap"><canvas id="chartBest"></canvas></div>
    </div>

  `;

  const chartDefaults = {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false }, tooltip: { mode: 'index' } },
    scales: {
      x: { grid: { color: '#E8EFF5' }, ticks: { font: { family: 'DM Mono', size: 10 }, color: '#8A9EAF' } },
      y: { grid: { color: '#E8EFF5' }, ticks: { font: { family: 'DM Mono', size: 10 }, color: '#8A9EAF' }, min: 0, max: 100 }
    }
  };

  // Accumulated running average up to each session
  const runningAvg = avgs.map((_, i) => {
    const slice = avgs.slice(0, i + 1);
    return parseFloat((slice.reduce((a,b) => a+b, 0) / slice.length).toFixed(1));
  });

  trendCharts.best = new Chart(document.getElementById('chartBest'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'FEV1 Max',
          data: avgs,
          borderColor: '#2D9E6B',
          backgroundColor: 'rgba(45,158,107,0.08)',
          borderWidth: 2.5,
          pointBackgroundColor: '#2D9E6B',
          pointRadius: 5,
          fill: true,
          tension: 0.3
        },
        {
          label: 'Accumulated Avg',
          data: runningAvg,
          borderColor: '#3B82C4',
          backgroundColor: 'transparent',
          borderWidth: 2,
          borderDash: [6, 4],
          pointRadius: 0,
          pointHoverRadius: 4,
          fill: false,
          tension: 0.3
        }
      ]
    },
    options: {
      ...chartDefaults,
      plugins: {
        legend: {
          display: true,
          labels: {
            font: { family: 'DM Sans', size: 11 },
            color: '#4A5E72',
            usePointStyle: true,
            pointStyle: 'line',
            boxWidth: 30,
            padding: 14
          }
        },
        tooltip: { mode: 'index', intersect: false }
      }
    }
  });

}

// ══════════════════════════════════════════════════
//  TIME PICKER
// ══════════════════════════════════════════════════
let tpH = 12, tpM = 0, tpAMPM = 'AM', repeatTimer = null;
let _tpTarget = 'log';

function openTimePicker() {
  _tpTarget = 'log';
  const now = new Date();
  tpH = now.getHours()%12||12; tpM = now.getMinutes();
  tpAMPM = now.getHours()>=12?'PM':'AM';
  renderTimePicker();
  document.getElementById('timePickerModal').classList.add('open');
}
function openEditTimePicker() {
  _tpTarget = 'edit';
  const val = document.getElementById('editTime').value;
  if (val) {
    const [hh,mm] = val.split(':');
    tpH = parseInt(hh)%12||12; tpM = parseInt(mm);
    tpAMPM = parseInt(hh)>=12?'PM':'AM';
  } else {
    const now = new Date();
    tpH = now.getHours()%12||12; tpM = now.getMinutes();
    tpAMPM = now.getHours()>=12?'PM':'AM';
  }
  renderTimePicker();
  document.getElementById('timePickerModal').classList.add('open');
}
function closeTimePicker() { document.getElementById('timePickerModal').classList.remove('open'); }
function renderTimePicker() {
  document.getElementById('tpHour').textContent = String(tpH).padStart(2,'0');
  document.getElementById('tpMin').textContent  = String(tpM).padStart(2,'0');
  document.getElementById('tpAM').classList.toggle('active', tpAMPM==='AM');
  document.getElementById('tpPM').classList.toggle('active', tpAMPM==='PM');
}
function nudge(field, dir) {
  if (field==='hour') tpH = (tpH-1+dir+12)%12+1;
  if (field==='min')  tpM = (tpM+dir+60)%60;
  renderTimePicker();
}
function startRepeat(field, dir) { nudge(field,dir); stopRepeat(); repeatTimer = setInterval(()=>nudge(field,dir),130); }
function stopRepeat() { if (repeatTimer) { clearInterval(repeatTimer); repeatTimer=null; } }
function setAmPm(v) { tpAMPM=v; renderTimePicker(); }
function confirmTime() {
  let h24 = tpH%12; if (tpAMPM==='PM') h24+=12;
  const timeStr = String(h24).padStart(2,'0')+':'+String(tpM).padStart(2,'0');
  const displayStr = String(tpH).padStart(2,'0')+':'+String(tpM).padStart(2,'0')+' '+tpAMPM;
  if (_tpTarget==='edit') {
    document.getElementById('editTime').value = timeStr;
    document.getElementById('editTimeText').textContent = displayStr;
  } else {
    document.getElementById('sessionTime').value = timeStr;
    document.getElementById('timeDisplayText').textContent = displayStr;
  }
  closeTimePicker();
}

// ══════════════════════════════════════════════════
//  TABS
// ══════════════════════════════════════════════════
function showTab(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
  if (name==='history') renderHistory();
  if (name==='trends')  renderTrends();
}

// ══════════════════════════════════════════════════
//  EXPORT
// ══════════════════════════════════════════════════
function exportData() {
  const sessions = getSessions();
  if (!sessions.length) { showToast('No data to export','error'); return; }
  const blob = new Blob([JSON.stringify(sessions,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `peak_flow_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  showToast('Exported ✓','success');
}

// ══════════════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════════════
function formatDate(d) { const [y,m,day]=d.split('-'); return `${m}/${day}/${y}`; }
function formatDateShort(d) { const [y,m,day]=d.split('-'); return `${m}/${day}`; }
function formatTime(t) {
  const [h,m]=t.split(':'); const hh=parseInt(h);
  return `${hh>12?hh-12:hh||12}:${m} ${hh>=12?'PM':'AM'}`;
}
function showToast(msg,type='') {
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast show'+(type?' '+type:'');
  setTimeout(()=>el.className='toast',2800);
}

function initDateTime() {
  const now = new Date();
  const yyyy=now.getFullYear(), mm=String(now.getMonth()+1).padStart(2,'0'), dd=String(now.getDate()).padStart(2,'0');
  document.getElementById('sessionDate').value=`${yyyy}-${mm}-${dd}`;
  const hh=now.getHours(), min=String(now.getMinutes()).padStart(2,'0');
  document.getElementById('sessionTime').value=String(hh).padStart(2,'0')+':'+min;
  const h12=hh%12||12, ampm=hh>=12?'PM':'AM';
  document.getElementById('timeDisplayText').textContent=String(h12).padStart(2,'0')+':'+min+' '+ampm;
}

initDateTime();
