<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peak Flow</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#F0F4F8; --surface:#fff; --border:#D0DCE8;
  --ink:#1A2533; --ink2:#4A5E72; --ink3:#8A9EAF;
  --accent:#3B82C4; --accent-light:#E8F1FA;
  --good:#2D9E6B; --good-bg:#E8F7F1;
  --warn:#E07B39; --warn-bg:#FDF0E8;
  --danger:#C94040; --danger-bg:#FAEAEA;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;min-height:100vh}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.header-left h1{font-family:'DM Serif Display',serif;font-size:20px}
.header-left p{font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:none;border:1.5px solid var(--border);color:var(--ink2)}
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px}
.tab{padding:12px 16px;font-size:13px;font-weight:500;color:var(--ink3);cursor:pointer;border:none;border-bottom:2px solid transparent;background:none;font-family:'DM Sans',sans-serif}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.page{display:none;padding:20px;max-width:580px;margin:0 auto}
.page.active{display:block}
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:20px;margin-bottom:16px}
.card-title{font-weight:600;font-size:15px;margin-bottom:16px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.form-group{display:flex;flex-direction:column;gap:6px}
label{font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
input[type=date],input[type=time],textarea,select{padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:14px;background:var(--bg);color:var(--ink);outline:none;width:100%;transition:border-color .15s}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:70px}
.reading-input{width:160px;font-size:52px;font-family:'DM Mono',monospace;text-align:center;padding:12px;border:2px solid var(--border);border-radius:var(--radius)}
.reading-input:focus{border-color:var(--accent)}
.reading-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.reading-unit{font-family:'DM Mono',monospace;font-size:20px;color:var(--ink3)}
.form-actions{display:flex;gap:10px;justify-content:flex-end}
/* History */
.hist-row{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.hist-date{font-size:12px;color:var(--ink3);min-width:90px}
.hist-val{font-size:22px;font-weight:700;font-family:'DM Mono',monospace;color:var(--accent)}
.hist-unit{font-size:12px;color:var(--ink3)}
.hist-note{font-size:12px;color:var(--ink2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.del-btn{background:none;border:none;color:var(--ink3);cursor:pointer;font-size:16px;padding:4px;flex-shrink:0}
.del-btn:hover{color:var(--danger)}
.badge{padding:3px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-good{background:var(--good-bg);color:var(--good)}
.badge-warn{background:var(--warn-bg);color:var(--warn)}
.badge-danger{background:var(--danger-bg);color:var(--danger)}
/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
.stat-label{font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.stat-val{font-size:22px;font-weight:700;font-family:'DM Mono',monospace;color:var(--ink)}
.stat-unit{font-size:11px;color:var(--ink3)}
/* Chart */
.chart-wrap{position:relative;height:260px}
/* Empty */
.empty{text-align:center;padding:40px 20px;color:var(--ink3)}
.empty-icon{font-size:36px;margin-bottom:10px}
.empty-title{font-size:15px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.empty-sub{font-size:13px}
/* Toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:999;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap}
#toast.show{opacity:1}
@media(max-width:480px){.form-row{grid-template-columns:1fr}.stats-row{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Peak Flow</h1>
    <p>FEV1 Surveillance</p>
  </div>
  <div style="display:flex;gap:8px">
    <button class="btn btn-ghost" onclick="exportData()">↓ Export</button>
    <button class="btn btn-primary" onclick="showTab('log')">+ New Reading</button>
  </div>
</header>

<div class="tabs">
  <button class="tab active" id="tab-log" onclick="showTab('log')">Log Reading</button>
  <button class="tab" id="tab-history" onclick="showTab('history')">History</button>
  <button class="tab" id="tab-trends" onclick="showTab('trends')">Trends</button>
</div>

<!-- LOG -->
<div class="page active" id="page-log">
  <div class="card">
    <div class="card-title">Session Details</div>
    <div class="form-row">
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="sessionDate">
      </div>
      <div class="form-group">
        <label>Time</label>
        <input type="time" id="sessionTime">
      </div>
    </div>
    <div class="form-group" style="margin-bottom:0">
      <label>Notes / Symptoms</label>
      <textarea id="sessionNotes" placeholder="e.g. felt good, slight shortness of breath…"></textarea>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Reading (mL)</div>
    <div class="reading-wrap">
      <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3)">Best Effort — Max Value</div>
      <div style="display:flex;align-items:center;gap:12px">
        <input type="number" class="reading-input" id="readingVal" min="0" max="10000" step="1" placeholder="—" oninput="onValInput()">
        <span class="reading-unit">mL</span>
      </div>
      <div style="font-size:12px;color:var(--ink3);text-align:center">Enter the highest value shown on your FEV1 device</div>
    </div>
  </div>

  <div class="form-actions">
    <button class="btn btn-ghost" onclick="clearForm()">Clear</button>
    <button class="btn btn-primary" id="saveBtn" onclick="saveSession()" disabled>Save Reading</button>
  </div>
</div>

<!-- HISTORY -->
<div class="page" id="page-history">
  <div id="historyContent"></div>
</div>

<!-- TRENDS -->
<div class="page" id="page-trends">
  <div class="stats-row" id="statsRow"></div>
  <div class="card">
    <div class="card-title">FEV1 Over Time</div>
    <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
  </div>
</div>

<div id="toast"></div>

<script>
const STORAGE_KEY = 'peak_flow_sessions_v1';

// ── Storage ──
function getSessions() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'); } catch(e) { return []; }
}

function saveToSupabase(sessions) {
  sessions.forEach(s => {
    const timeStr = (s.time||'00:00').slice(0,5);
    const ts = s.date ? s.date+'T'+timeStr+':00Z' : new Date().toISOString();
    window.parent.postMessage({ type:'SYNC_SAVE_HEALTH_RECORD', module:'peak_flow', recordedAt:ts, data:s }, '*');
  });
}

function deleteFromSupabase(session) {
  const timeStr = (session.time||'00:00').slice(0,5);
  const ts = session.date ? session.date+'T'+timeStr+':00Z' : null;
  if (ts) window.parent.postMessage({ type:'SYNC_DELETE_HEALTH_RECORD', module:'peak_flow', recordedAt:ts }, '*');
}

function persistSessions(sessions) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
}

// ── UI helpers ──
function showTab(name) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
  if (name==='history') renderHistory();
  if (name==='trends') renderTrends();
}

function showToast(msg, type='success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = type==='success'?'#E8F7F1':type==='error'?'#FAEAEA':'#E8F1FA';
  el.style.color = type==='success'?'#2D9E6B':type==='error'?'#C94040':'#3B82C4';
  el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'), 2500);
}

function fmtDate(d) {
  if (!d) return '—';
  const dt = new Date(d+'T12:00:00');
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

function fmtTime(t) {
  if (!t) return '';
  const [hh,mm] = t.split(':');
  const h = parseInt(hh), ampm = h>=12?'PM':'AM';
  return (h%12||12)+':'+mm+' '+ampm;
}

function daysSince(d) {
  if (!d) return null;
  return Math.floor((new Date()-new Date(d+'T12:00:00'))/86400000);
}

// ── Form ──
function initForm() {
  const now = new Date();
  const yyyy=now.getFullYear(), mm=String(now.getMonth()+1).padStart(2,'0'), dd=String(now.getDate()).padStart(2,'0');
  document.getElementById('sessionDate').value = `${yyyy}-${mm}-${dd}`;
  const hh=String(now.getHours()).padStart(2,'0'), min=String(now.getMinutes()).padStart(2,'0');
  document.getElementById('sessionTime').value = `${hh}:${min}`;
  document.getElementById('readingVal').value = '';
  document.getElementById('sessionNotes').value = '';
  document.getElementById('saveBtn').disabled = true;
}

function onValInput() {
  const v = parseFloat(document.getElementById('readingVal').value);
  document.getElementById('saveBtn').disabled = isNaN(v) || v <= 0;
}

function clearForm() { initForm(); }

function saveSession() {
  const date  = document.getElementById('sessionDate').value;
  const time  = document.getElementById('sessionTime').value;
  const notes = document.getElementById('sessionNotes').value.trim();
  const val   = parseFloat(document.getElementById('readingVal').value);

  if (!date) { showToast('Please select a date','error'); return; }
  if (isNaN(val) || val <= 0) { showToast('Enter a valid reading','error'); return; }

  const session = { id:Date.now(), date, time:time||null, notes, best:val, avg:val, blows:[val,null,null] };
  const sessions = getSessions();
  sessions.push(session);
  sessions.sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));
  persistSessions(sessions);
  saveToSupabase([session]); // only save the new one
  syncShowStatus('synced');
  showToast('Reading saved ✓','success');
  clearForm();
  showTab('history');
}

// ── History ──
function renderHistory() {
  const sessions = getSessions().slice().reverse();
  const el = document.getElementById('historyContent');
  if (!sessions.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">📊</div><div class="empty-title">No readings yet</div><div class="empty-sub">Log your first peak flow reading above.</div></div>`;
    return;
  }
  const all = getSessions();
  const vals = all.map(s=>s.best).filter(v=>v!=null);
  const avg = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
  el.innerHTML = sessions.map(s => {
    const ds = daysSince(s.date);
    const sinceStr = ds===0?'Today':ds===1?'Yesterday':ds+'d ago';
    let badgeCls='', badgeTxt='';
    if (avg) {
      const pct = (s.best/avg)*100;
      if (pct>=90){badgeCls='badge-good';badgeTxt='Normal';}
      else if (pct>=70){badgeCls='badge-warn';badgeTxt='Below avg';}
      else {badgeCls='badge-danger';badgeTxt='Low';}
    }
    return `<div class="hist-row">
      <div class="hist-date">${fmtDate(s.date)}<br><span style="font-size:11px">${fmtTime(s.time)||sinceStr}</span></div>
      <div class="hist-val">${s.best}<span class="hist-unit"> mL</span></div>
      ${badgeTxt?`<span class="badge ${badgeCls}">${badgeTxt}</span>`:''}
      <div class="hist-note">${s.notes||''}</div>
      <button class="del-btn" onclick="deleteSession(${s.id})">🗑</button>
    </div>`;
  }).join('');
}

function deleteSession(id) {
  if (!confirm('Delete this reading?')) return;
  const sessions = getSessions();
  const s = sessions.find(s=>s.id===id);
  if (s) deleteFromSupabase(s);
  persistSessions(sessions.filter(s=>s.id!==id));
  renderHistory();
  showToast('Deleted');
}

// ── Trends ──
let trendChartInst = null;
function renderTrends() {
  const sessions = getSessions();
  const el = document.getElementById('statsRow');
  if (!sessions.length) {
    el.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="empty-icon">📈</div><div class="empty-title">No data yet</div><div class="empty-sub">Log readings to see trends.</div></div>`;
    if (trendChartInst) { trendChartInst.destroy(); trendChartInst=null; }
    return;
  }
  const vals = sessions.map(s=>s.best).filter(v=>v!=null);
  const latest = vals[vals.length-1];
  const avg = Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
  const best = Math.max(...vals);
  el.innerHTML = `
    <div class="stat-card"><div class="stat-label">Latest</div><div class="stat-val">${latest}</div><div class="stat-unit">mL</div></div>
    <div class="stat-card"><div class="stat-label">Average</div><div class="stat-val">${avg}</div><div class="stat-unit">mL</div></div>
    <div class="stat-card"><div class="stat-label">Best</div><div class="stat-val">${best}</div><div class="stat-unit">mL</div></div>`;

  const labels = sessions.map(s=>fmtDate(s.date));
  const data   = sessions.map(s=>s.best);
  const avgLine = sessions.map(()=>avg);
  const ctx = document.getElementById('trendChart').getContext('2d');
  if (trendChartInst) { trendChartInst.destroy(); }
  trendChartInst = new Chart(ctx, {
    type:'line',
    data:{ labels, datasets:[
      { label:'FEV1', data, borderColor:'#3B82C4', backgroundColor:'#3B82C420', fill:true, tension:0.3, pointRadius:4, borderWidth:2 },
      { label:'Average', data:avgLine, borderColor:'#8A9EAF', borderDash:[5,4], pointRadius:0, borderWidth:1.5 }
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:i=>` ${i.raw} mL` } } },
      scales:{ y:{ beginAtZero:false, ticks:{color:'#8A9EAF',font:{size:11}}, grid:{color:'#E8EAF0'} },
               x:{ ticks:{color:'#8A9EAF',font:{size:11},maxTicksLimit:6}, grid:{color:'#E8EAF0'} } }
    }
  });
}

// ── Export ──
function exportData() {
  const s = getSessions();
  if (!s.length) { showToast('No data to export','error'); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));
  a.download = `peak_flow_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  showToast('Exported ✓');
}

// ── Init ──
initForm();
renderHistory();

(async()=>{
  if (!new URLSearchParams(location.search).get('preloaded')) {
    try {
      const rows = await syncLoadHealthRecords('peak_flow');
      if (rows&&rows.length) {
        persistSessions(rows.map(r=>r.data));
        renderHistory();
        renderTrends();
      }
    } catch(e) {}
  } else {
    renderHistory();
  }
})();
</script>
</body>
</html>
