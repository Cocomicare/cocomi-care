<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medications</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

:root {
  --bg:#F0F4F8;--surface:#fff;--surface2:#E8EFF5;--border:#D0DCE8;
  --ink:#1A2533;--ink2:#4A5E72;--ink3:#8A9EAF;
  --good:#2D9E6B;--good-bg:#E8F7F1;
  --danger:#C94040;--danger-bg:#FAEAEA;
  --warn:#E07B39;--warn-bg:#FDF0E8;
  --purple:#6B4FA8;--purple-bg:#F0EAFA;--purple-light:#faf8ff;
  --radius:12px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;}
.app{display:flex;flex-direction:column;height:100vh;max-width:640px;margin:0 auto;background:var(--surface);box-shadow:0 0 40px rgba(0,0,0,.06);}

/* Header */
.header{padding:0 18px;display:flex;align-items:center;justify-content:space-between;height:56px;border-bottom:1px solid var(--border);flex-shrink:0;}
.header-title{font-family:'DM Serif Display',serif;font-size:18px;color:var(--ink);}
.header-sub{font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;}
.print-btn{background:var(--purple);color:#fff;border:none;border-radius:20px;padding:7px 16px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;}

/* Content */
.content{flex:1;overflow-y:auto;padding:16px 16px 24px;}

/* Info bar */
.info-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.info-counts{font-size:13px;color:var(--ink2);}
.info-updated{font-size:11px;color:var(--ink3);}

/* Section */
.section{margin-bottom:20px;}
.section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.section-count{font-size:10px;font-weight:600;color:var(--purple);background:var(--purple-bg);padding:1px 7px;border-radius:8px;}

/* Med card */
.med-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:border-color .15s;}
.med-card:hover{border-color:#c8b8e8;}

/* Card header — always visible */
.med-header{display:flex;align-items:flex-start;gap:10px;padding:13px 15px;cursor:pointer;}
.med-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:6px;}
.med-dot.active{background:var(--good);}
.med-dot.inactive{background:var(--ink3);}
.med-main{flex:1;min-width:0;}
.med-name{font-size:14px;font-weight:600;color:var(--ink);}
.med-summary{font-size:12px;color:var(--ink2);margin-top:3px;}
.med-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
.med-cat{font-size:10px;font-weight:600;color:var(--purple);background:var(--purple-bg);padding:2px 8px;border-radius:8px;white-space:nowrap;}
.expand-icon{font-size:11px;color:var(--ink3);transition:transform .2s;}
.med-card.open .expand-icon{transform:rotate(180deg);}

/* Card body — expandable */
.med-body{display:none;padding:0 15px 14px 34px;border-top:1px solid var(--surface2);}
.med-card.open .med-body{display:block;}

.detail-row{margin-bottom:10px;}
.detail-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ink3);margin-bottom:3px;}
.detail-text{font-size:13px;color:var(--ink2);line-height:1.55;}

/* Side effects */
.se-toggle{display:flex;align-items:center;gap:6px;cursor:pointer;padding:7px 10px;background:var(--warn-bg);border-radius:var(--radius-sm);margin-top:8px;border:none;font-family:'DM Sans',sans-serif;width:100%;text-align:left;}
.se-toggle-label{font-size:12px;font-weight:600;color:var(--warn);flex:1;}
.se-arrow{font-size:10px;color:var(--warn);transition:transform .2s;}
.se-toggle.open .se-arrow{transform:rotate(180deg);}
.se-list{display:none;margin-top:8px;padding:10px 12px;background:var(--warn-bg);border-radius:var(--radius-sm);}
.se-list.show{display:block;}
.se-item{font-size:12px;color:var(--ink2);padding:3px 0;padding-left:12px;position:relative;line-height:1.5;}
.se-item::before{content:'·';position:absolute;left:2px;color:var(--warn);}

/* Monitoring section */
.monitor-box{margin-top:8px;padding:10px 12px;background:var(--surface2);border-radius:var(--radius-sm);}
.monitor-item{font-size:12px;color:var(--ink2);padding:2px 0;padding-left:12px;position:relative;}
.monitor-item::before{content:'→';position:absolute;left:0;color:var(--purple);font-size:10px;top:3px;}

/* Card actions */
.med-actions{display:flex;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--surface2);}
.act-btn{flex:1;padding:7px;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:none;color:var(--ink2);transition:all .15s;}
.act-btn:hover{border-color:var(--purple);color:var(--purple);}
.act-btn.stop{color:var(--danger);border-color:#f0c0c0;}
.act-btn.stop:hover{background:var(--danger-bg);}

/* Empty */
.empty{text-align:center;padding:48px 24px;color:var(--ink3);}
.empty-icon{font-size:40px;margin-bottom:12px;}
.empty-title{font-family:'DM Serif Display',serif;font-size:18px;color:var(--ink2);margin-bottom:6px;}
.empty-sub{font-size:13px;line-height:1.6;max-width:300px;margin:0 auto;}

/* Add bar */
.add-bar{border-top:1px solid var(--border);padding:12px 16px;background:var(--surface);flex-shrink:0;}
.add-row{display:flex;gap:8px;}
.add-input{flex:1;border:1.5px solid var(--border);border-radius:20px;padding:9px 14px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--ink);background:var(--bg);outline:none;transition:border-color .15s;}
.add-input:focus{border-color:var(--purple);}
.add-btn{background:var(--purple);color:#fff;border:none;border-radius:20px;padding:9px 18px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
.add-hint{font-size:11px;color:var(--ink3);margin-top:5px;padding:0 4px;}

/* Edit modal */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-end;justify-content:center;}
.modal-backdrop.show{display:flex;}
.modal{background:var(--surface);border-radius:20px 20px 0 0;padding:22px 18px 32px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;}
.modal-title{font-family:'DM Serif Display',serif;font-size:17px;color:var(--ink);margin-bottom:16px;}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
.field label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;color:var(--ink2);}
.field input,.field select,.field textarea{border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink);background:var(--bg);outline:none;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--purple);}
.field textarea{resize:vertical;min-height:60px;font-size:13px;}
.modal-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.modal-actions{display:flex;gap:10px;margin-top:8px;}
.btn-cancel{flex:1;background:none;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink2);cursor:pointer;}
.btn-save{flex:2;background:var(--purple);color:#fff;border:none;border-radius:var(--radius-sm);padding:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;z-index:999;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.success{background:var(--good);}

/* Print */
@media print {
  .add-bar,.act-btn,.modal-backdrop,.toast,.print-btn,.se-toggle,.expand-icon{display:none!important;}
  .med-body{display:block!important;}
  .se-list{display:block!important;}
  .app{box-shadow:none;max-width:100%;}
  body{background:#fff;}
  .header{border-bottom:2px solid #000;}
  .med-card{border:1px solid #ccc;page-break-inside:avoid;margin-bottom:8px;}
  .content{overflow:visible;}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <div class="header-title">Medications</div>
      <div class="header-sub">Current medication list</div>
    </div>
    <div style="display:flex;gap:8px">
      <button onclick="resetToDefaults()" style="background:none;border:1px solid var(--border);border-radius:20px;padding:7px 14px;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--ink3);cursor:pointer">↺ Reset</button>
      <button class="print-btn" onclick="window.print()">🖨️ Print</button>
    </div>
  </div>

  <div class="content" id="content"></div>

  <div class="add-bar">
    <div class="add-row">
      <input class="add-input" id="quick-add" placeholder="Add: e.g. Tacrolimus 2mg twice daily" onkeydown="if(event.key==='Enter')quickAdd()">
      <button class="add-btn" onclick="quickAdd()">+ Add</button>
    </div>
    <div class="add-hint">Upload a medication document in Clinical Assistant to auto-update this list.</div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-backdrop" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title">Edit Medication</div>
    <div class="field"><label>Drug Name</label><input id="e-name" placeholder="e.g. Tacrolimus"></div>
    <div class="modal-2col">
      <div class="field"><label>Dose</label><input id="e-dose" placeholder="e.g. 2mg"></div>
      <div class="field"><label>Frequency</label><input id="e-freq" placeholder="e.g. twice daily"></div>
    </div>
    <div class="field"><label>Timing / Instructions</label><input id="e-timing" placeholder="e.g. morning and evening with food"></div>
    <div class="modal-2col">
      <div class="field"><label>Category</label>
        <select id="e-cat">
          <option>Immunosuppression</option><option>Antiviral</option><option>Antifungal</option>
          <option>Antibiotic</option><option>Cardiac</option><option>Other</option>
        </select>
      </div>
      <div class="field"><label>Status</label>
        <select id="e-active"><option value="true">Active</option><option value="false">Stopped</option></select>
      </div>
    </div>
    <div class="field"><label>Purpose / Why prescribed</label><textarea id="e-purpose" placeholder="e.g. Prevents organ rejection by suppressing the immune system"></textarea></div>
    <div class="field"><label>Side effects to watch for</label><textarea id="e-se" placeholder="One per line, e.g.&#10;Kidney toxicity (monitor creatinine)&#10;Tremors&#10;High blood pressure"></textarea></div>
    <div class="field"><label>Monitoring requirements</label><textarea id="e-monitor" placeholder="One per line, e.g.&#10;Trough level every 1-2 weeks&#10;BMP every 2 weeks"></textarea></div>
    <div class="field"><label>Notes</label><textarea id="e-note" placeholder="Additional notes, interactions, special instructions…"></textarea></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const MEDS_KEY = 'clinical_meds_v1';
const CAT_ORDER = ['Immunosuppression','Antiviral','Antifungal','Antibiotic','Cardiac','Other'];

function getMeds()    { try{return JSON.parse(localStorage.getItem(MEDS_KEY)||'[]');}catch(e){return[];} }
function saveMeds(d) {
  localStorage.setItem(MEDS_KEY, JSON.stringify(d));
  syncSaveClinical('medications', d).then(()=>syncShowStatus('synced')).catch(()=>syncShowStatus('error'));
}

// ── RENDER ──
function render() {
  const meds   = getMeds();
  const active = meds.filter(m => m.active);
  const stopped= meds.filter(m => !m.active);
  const el     = document.getElementById('content');

  if (!meds.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">💊</div><div class="empty-title">No medications yet</div><div class="empty-sub">Add medications below, or upload a document in Clinical Assistant to auto-populate this list.</div></div>`;
    return;
  }

  const lastUpdated = meds.reduce((a,m)=>(m.updated||'')>a?(m.updated||''):a,'');
  const updStr = lastUpdated ? 'Updated ' + new Date(lastUpdated).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';

  let html = `<div class="info-bar"><div class="info-counts"><strong>${active.length}</strong> active · <span style="color:var(--ink3)">${stopped.length} stopped</span></div><div class="info-updated">${updStr}</div></div>`;

  const cats = {};
  active.forEach(m => { const c=m.category||'Other'; if(!cats[c]) cats[c]=[]; cats[c].push(m); });

  CAT_ORDER.forEach(cat => {
    if (!cats[cat]?.length) return;
    html += `<div class="section"><div class="section-title">${cat} <span class="section-count">${cats[cat].length}</span></div>${cats[cat].map(m=>medCard(m)).join('')}</div>`;
  });
  Object.keys(cats).filter(c=>!CAT_ORDER.includes(c)).forEach(cat => {
    html += `<div class="section"><div class="section-title">${cat} <span class="section-count">${cats[cat].length}</span></div>${cats[cat].map(m=>medCard(m)).join('')}</div>`;
  });
  if (stopped.length) {
    html += `<div class="section"><div class="section-title" style="color:var(--ink3)">Stopped / Inactive <span class="section-count" style="background:var(--surface2);color:var(--ink3)">${stopped.length}</span></div>${stopped.map(m=>medCard(m)).join('')}</div>`;
  }

  el.innerHTML = html;
}

function medCard(m) {
  const summary = [m.dose, m.freq, m.timing].filter(Boolean).join(' · ');
  const hasSE      = m.sideEffects?.length > 0;
  const hasMonitor = m.monitoring?.length > 0;
  const hasBody    = m.purpose || hasSE || hasMonitor || m.note;

  return `<div class="med-card" id="mc-${m.id}">
    <div class="med-header" onclick="toggleCard('${m.id}')">
      <div class="med-dot ${m.active?'active':'inactive'}"></div>
      <div class="med-main">
        <div class="med-name">${m.name}${m.dose?' <span style="font-family:DM Mono,monospace;font-size:12px;font-weight:500;color:var(--purple);margin-left:6px">'+m.dose+'</span>':''}</div>
        ${summary?`<div class="med-summary">${summary}</div>`:''}
      </div>
      <div class="med-right">
        <span class="med-cat">${m.category||'Other'}</span>
        ${hasBody?`<span class="expand-icon">▼</span>`:''}
      </div>
    </div>
    ${hasBody ? `<div class="med-body">
      ${m.purpose?`<div class="detail-row"><div class="detail-label">Purpose</div><div class="detail-text">${m.purpose}</div></div>`:''}
      ${hasSE?`
        <button class="se-toggle" id="se-btn-${m.id}" onclick="toggleSE('${m.id}')">
          <span style="font-size:14px">⚠️</span>
          <span class="se-toggle-label">Side effects to watch for (${m.sideEffects.length})</span>
          <span class="se-arrow">▼</span>
        </button>
        <div class="se-list" id="se-${m.id}">
          ${m.sideEffects.map(s=>`<div class="se-item">${s}</div>`).join('')}
        </div>`:''}
      ${hasMonitor?`<div class="detail-row" style="margin-top:8px"><div class="detail-label">Monitoring</div><div class="monitor-box">${m.monitoring.map(s=>`<div class="monitor-item">${s}</div>`).join('')}</div></div>`:''}
      ${m.note?`<div class="detail-row"><div class="detail-label">Notes</div><div class="detail-text">${m.note}</div></div>`:''}
      <div class="med-actions">
        <button class="act-btn" onclick="openEdit('${m.id}')">✏️ Edit</button>
        <button class="act-btn" onclick="toggleActive('${m.id}')">${m.active?'⏹ Stop':'▶ Restart'}</button>
        <button class="act-btn stop" onclick="deleteMed('${m.id}')">🗑 Remove</button>
      </div>
    </div>` : `<div style="padding:0 15px 12px 34px;border-top:1px solid var(--surface2);display:flex;gap:8px">
      <button class="act-btn" onclick="openEdit('${m.id}')">✏️ Edit</button>
      <button class="act-btn" onclick="toggleActive('${m.id}')">${m.active?'⏹ Stop':'▶ Restart'}</button>
      <button class="act-btn stop" onclick="deleteMed('${m.id}')">🗑 Remove</button>
    </div>`}
  </div>`;
}

function toggleCard(id) {
  const card = document.getElementById('mc-'+id);
  if (card) card.classList.toggle('open');
}

function toggleSE(id) {
  const btn  = document.getElementById('se-btn-'+id);
  const list = document.getElementById('se-'+id);
  if (btn)  btn.classList.toggle('open');
  if (list) list.classList.toggle('show');
}

// ── QUICK ADD ──
function quickAdd() {
  const input = document.getElementById('quick-add');
  const text  = input.value.trim();
  if (!text) return;
  const words     = text.split(/\s+/);
  const name      = words[0];
  const doseMatch = text.match(/\b(\d+\.?\d*\s*(?:mg|mcg|g|ml|mL|units?|tabs?|caps?))\b/i);
  const freqMatch = text.match(/\b(once|twice|three times|every \d+ hours?|daily|weekly|BID|TID|QID|QD|PRN|as needed)\b/i);
  const meds = getMeds();
  meds.push({id:Date.now().toString(), name, dose:doseMatch?doseMatch[1]:'', freq:freqMatch?freqMatch[0]:'', timing:'', purpose:'', sideEffects:[], monitoring:[], note:'', category:'Other', active:true, updated:new Date().toISOString()});
  saveMeds(meds); render(); input.value='';
  showToast(name + ' added ✓','success');
}

// ── TOGGLE / DELETE ──
function toggleActive(id) {
  const meds=getMeds(); const m=meds.find(x=>x.id===id);
  if(m){m.active=!m.active;m.updated=new Date().toISOString();}
  saveMeds(meds); render();
  showToast(m.active?m.name+' restarted':m.name+' marked stopped');
}
function deleteMed(id) {
  const meds=getMeds(); const m=meds.find(x=>x.id===id);
  if(!confirm('Remove '+(m?.name||'this medication')+'?')) return;
  saveMeds(meds.filter(x=>x.id!==id)); render(); showToast('Removed');
}

// ── EDIT MODAL ──
let editingId=null;
function openEdit(id) {
  const m=getMeds().find(x=>x.id===id); if(!m) return;
  editingId=id;
  document.getElementById('e-name').value    = m.name||'';
  document.getElementById('e-dose').value    = m.dose||'';
  document.getElementById('e-freq').value    = m.freq||'';
  document.getElementById('e-timing').value  = m.timing||'';
  document.getElementById('e-cat').value     = m.category||'Other';
  document.getElementById('e-active').value  = m.active?'true':'false';
  document.getElementById('e-purpose').value = m.purpose||'';
  document.getElementById('e-se').value      = (m.sideEffects||[]).join('\n');
  document.getElementById('e-monitor').value = (m.monitoring||[]).join('\n');
  document.getElementById('e-note').value    = m.note||'';
  document.getElementById('modal').classList.add('show');
}
function closeModal() { editingId=null; document.getElementById('modal').classList.remove('show'); }
function saveEdit() {
  const meds=getMeds(); const idx=meds.findIndex(m=>m.id===editingId); if(idx<0) return;
  const seRaw = document.getElementById('e-se').value;
  const monRaw= document.getElementById('e-monitor').value;
  meds[idx]={...meds[idx],
    name:     document.getElementById('e-name').value.trim(),
    dose:     document.getElementById('e-dose').value.trim(),
    freq:     document.getElementById('e-freq').value.trim(),
    timing:   document.getElementById('e-timing').value.trim(),
    purpose:  document.getElementById('e-purpose').value.trim(),
    sideEffects: seRaw.split('\n').map(s=>s.trim()).filter(Boolean),
    monitoring:  monRaw.split('\n').map(s=>s.trim()).filter(Boolean),
    note:     document.getElementById('e-note').value.trim(),
    category: document.getElementById('e-cat').value,
    active:   document.getElementById('e-active').value==='true',
    updated:  new Date().toISOString()
  };
  saveMeds(meds); closeModal(); render(); showToast('Updated ✓','success');
}

// ── TOAST ──
function showToast(msg,type=''){const e=document.getElementById('toast');e.textContent=msg;e.className='toast show'+(type?' '+type:'');setTimeout(()=>e.className='toast',2800);}

// ── INIT ──
function resetToDefaults() {
  if(!confirm('Reset to default medication list? This will overwrite your current list.')) return;
  localStorage.removeItem(MEDS_KEY);
  initKnownMeds();
  render();
  showToast('Reset to defaults ✓','success');
}

function initKnownMeds() {
  if(getMeds().length) return; // Already set up
  const now = new Date().toISOString();
  const known = [
    {name:'Tacrolimus',     dose:'2mg',  freq:'twice daily',  timing:'Morning and evening',
     purpose:'Primary anti-rejection medication. Suppresses T-cells to prevent the immune system from attacking the transplanted lungs.',
     sideEffects:['Kidney toxicity — monitor creatinine and BMP','Tremors or shakiness','High blood pressure','Elevated blood sugar / diabetes risk','Increased infection risk','Neurotoxicity (headache, confusion at high levels)','Hair thinning'],
     monitoring:['Trough level (blood draw before morning dose) — target 8-12 ng/mL early post-transplant','BMP every 1-2 weeks (creatinine, electrolytes)','Blood pressure at home daily'],
     note:'Must be taken at consistent times. Do NOT take with grapefruit. Trough level critically important.',
     category:'Immunosuppression'},
    {name:'CellCept',       dose:'500mg',  freq:'twice daily',  timing:'With food',
     purpose:'Mycophenolate mofetil. Second immunosuppressant that blocks immune cell proliferation. Works alongside tacrolimus to prevent rejection.',
     sideEffects:['GI upset, nausea, diarrhea (common)','Increased infection risk','Low white blood cell count','Anemia'],
     monitoring:['CBC every 1-2 weeks','Dose may be adjusted based on WBC'],
     note:'Take with food to reduce GI side effects.',
     category:'Immunosuppression'},

(async () => {
  // Pull from Supabase first
  const remote = await syncLoadClinical('medications');
  if (remote && Array.isArray(remote) && remote.length) {
    localStorage.setItem(MEDS_KEY, JSON.stringify(remote));
  }
  // Only load hardcoded defaults if there's truly nothing saved yet
  const existing = getMeds();
  if (!existing.length) {
    initKnownMeds();
  }
  render();

  // Listen for updates from Clinical Assistant (same-origin localStorage changes)
  window.addEventListener('storage', e => {
    if (e.key === MEDS_KEY) render();
  });

  // Also poll every 3 seconds in case storage event doesn't fire (same-tab iframe quirk)
  setInterval(() => render(), 3000);
})();
</script>
