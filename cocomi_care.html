<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocomi Care</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg:      #F0F4F8;
    --surface: #FFFFFF;
    --surface2:#E8EFF5;
    --border:  #D0DCE8;
    --ink:     #1A2533;
    --ink2:    #4A5E72;
    --ink3:    #8A9EAF;
    --good:    #2D9E6B;
    --good-bg: #E8F7F1;
    --warn:    #E07B39;
    --warn-bg: #FDF0E8;
    --danger:  #C94040;
    --danger-bg:#FAEAEA;
    --radius:  14px;
    --radius-sm:8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }

  /* ── SHELL VIEWS ── */
  #view-home    { display: block; }
  #view-module  { display: none; height: 100vh; overflow: hidden; flex-direction: column; }
  #view-module.active { display: flex; }

  /* ── HOME HEADER ── */
  .home-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px 14px;
    position: sticky; top: 0; z-index: 50;
  }
  .home-header-top {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px;
  }
  .app-name {
    font-family: 'DM Serif Display', serif;
    font-size: 22px; color: var(--ink); letter-spacing: -0.5px;
  }
  .app-sub { font-size: 11px; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.6px; }
  .greeting {
    font-size: 13px; color: var(--ink2); margin-top: 6px;
  }
  .greeting strong { color: var(--ink); font-weight: 600; }

  /* ── ALERT BANNER ── */
  .global-alert {
    margin: 12px 20px 0;
    display: none;
    background: var(--danger-bg);
    border: 1px solid #f0c0c0;
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 13px;
    color: var(--danger);
    font-weight: 500;
  }
  .global-alert.show { display: block; }

  /* ── DASHBOARD ── */
  .dashboard { padding: 16px 16px 32px; max-width: 600px; margin: 0 auto; }
  .dash-section-label {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.6px; color: var(--ink3); margin-bottom: 10px; margin-top: 4px;
  }

  /* ── MODULE TILES ── */
  .tiles-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 14px 14px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .tile:active { transform: scale(0.97); }
  .tile::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 4px; border-radius: 4px 0 0 4px;
  }

  /* Module accent colors */
  .tile.immuno::before  { background: #7B5EA7; }
  .tile.flutter::before { background: #2D9E6B; }
  .tile.peakflow::before{ background: #3B82C4; }
  .tile.vitals::before  { background: #C94040; }
  .tile.spiro::before   { background: #6B4FA8; }
  .tile.medlog::before  { background: #C4663B; }
  .tile.labs::before    { background: #0E7490; }

  .tile-icon   { font-size: 22px; margin-bottom: 8px; display: block; }
  .tile-name   { font-size: 12px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
  .tile-val    { font-family: 'DM Mono', monospace; font-size: 20px; font-weight: 500; color: var(--ink); line-height: 1; margin-bottom: 3px; }
  .tile-sub    { font-size: 11px; color: var(--ink3); }
  .tile-since  { font-size: 10px; color: var(--ink3); margin-top: 5px; }

  /* Alert states */
  .tile.alert-warn  { border-color: #f0d0b0; background: var(--warn-bg); }
  .tile.alert-danger{ border-color: #f0c0c0; background: var(--danger-bg); }
  .tile-alert-dot {
    position: absolute; top: 10px; right: 10px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--danger);
    display: none;
  }
  .tile.alert-danger .tile-alert-dot,
  .tile.alert-warn .tile-alert-dot { display: block; }
  .tile.alert-warn .tile-alert-dot { background: var(--warn); }

  /* Overdue nudge */
  .tile.overdue { border-color: #f0d0b0; }
  .tile-since.overdue { color: var(--warn); font-weight: 500; }

  /* ── LAST UPDATED ── */
  .last-updated { text-align: center; font-size: 11px; color: var(--ink3); margin-top: 8px; }

  /* ── MODULE FRAME ── */
  .module-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    display: flex; align-items: center; gap: 12px;
    height: 52px; flex-shrink: 0;
  }
  .back-btn {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 500; color: var(--ink2);
    cursor: pointer; background: none; border: none;
    padding: 6px 0; -webkit-tap-highlight-color: transparent;
  }
  .back-btn:active { opacity: 0.6; }
  .back-arrow { font-size: 18px; }
  .module-bar-title {
    font-family: 'DM Serif Display', serif;
    font-size: 16px; color: var(--ink); flex: 1;
  }
  .module-iframe {
    flex: 1; border: none; width: 100%; height: 100%;
    background: var(--bg);
  }

  /* ── EMPTY STATE ── */
  .tile-empty { color: var(--ink3); font-size: 13px; font-style: italic; }

  /* ── FOOTER ── */
  .home-footer {
    text-align: center; padding: 20px 20px 32px;
    font-size: 11px; color: var(--ink3); line-height: 1.6;
  }
  .home-footer strong { color: var(--ink2); }

  /* ── LOADING ── */
  .module-loading {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 200px; color: var(--ink3); gap: 12px;
  }
  .loading-spinner {
    width: 24px; height: 24px;
    border: 2px solid var(--border);
    border-top-color: var(--ink3);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 380px) {
    .tiles-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- ══════════════════════════════════
     HOME VIEW
══════════════════════════════════ -->
<div id="view-home">

  <div class="home-header">
    <div class="home-header-top">
      <div>
        <div class="app-name">Cocomi Care</div>
        <div class="app-sub">Lung Transplant Surveillance</div>
      </div>
      <div style="font-size:28px">🫁</div>
    </div>
    <div class="greeting" id="greeting"></div>
  </div>

  <div class="global-alert" id="global-alert"></div>

  <div class="dashboard">
    <div class="dash-section-label">Pulmonary</div>
    <div class="tiles-grid" id="tiles-pulmonary"></div>

    <div class="dash-section-label">Vitals & Labs</div>
    <div class="tiles-grid" id="tiles-vitals"></div>

    <div class="dash-section-label">Medications & Symptoms</div>
    <div class="tiles-grid" id="tiles-meds"></div>

    <div class="last-updated" id="last-updated"></div>
  </div>

  <div class="home-footer">
    <strong>Cocomi Care</strong> · Lung Transplant Surveillance Suite<br>
    Data stored locally on this device · Export from each module
  </div>

</div>

<!-- ══════════════════════════════════
     MODULE VIEW (iframe container)
══════════════════════════════════ -->
<div id="view-module">
  <div class="module-bar">
    <button class="back-btn" onclick="goHome()">
      <span class="back-arrow">←</span>
      <span>Home</span>
    </button>
    <div class="module-bar-title" id="module-bar-title"></div>
  </div>
  <iframe class="module-iframe" id="module-iframe" src="about:blank"></iframe>
</div>

<script>
// ══════════════════════════════════════════════
//  MODULE DEFINITIONS
// ══════════════════════════════════════════════
const MODULES = [
  {
    id:       'immuno',
    name:     'Immunosuppression',
    icon:     '💊',
    color:    '#7B5EA7',
    file:     'cocomi_medication_balance.html',
    group:    'pulmonary',
    cadence:  null,
    getSummary() {
      // Immunosuppression dashboard uses its own storage
      return { val: null, sub: 'Rejection / Infection balance', since: null };
    }
  },
  {
    id:       'flutter',
    name:     'Flutter Tracker',
    icon:     '🫁',
    color:    '#2D9E6B',
    file:     'flutter_tracker.html',
    group:    'pulmonary',
    cadence:  1,
    getSummary() {
      try {
        const sessions = JSON.parse(localStorage.getItem('flutter_sessions_v1')||'[]');
        if (!sessions.length) return { val: null, sub: 'UP clicks per session', since: null };
        const last = sessions[sessions.length-1];
        const days = daysSince(last.date);
        return {
          val:   last.totals.totalClicks,
          unit:  'clicks',
          sub:   `${last.totals.setCount} set${last.totals.setCount>1?'s':''}`,
          since: days,
          alert: null
        };
      } catch(e) { return { val: null, sub: 'UP clicks per session', since: null }; }
    }
  },
  {
    id:       'peakflow',
    name:     'Peak Flow',
    icon:     '📊',
    color:    '#3B82C4',
    file:     'peak_flow_tracker.html',
    group:    'pulmonary',
    cadence:  3,
    getSummary() {
      try {
        const sessions = JSON.parse(localStorage.getItem('peak_flow_sessions_v1')||'[]');
        if (!sessions.length) return { val: null, sub: 'Average of 3 blows', since: null };
        const last = sessions[sessions.length-1];
        const days = daysSince(last.date);
        return { val: last.avg, unit: '', sub: 'avg peak flow', since: days };
      } catch(e) { return { val: null, sub: 'Average of 3 blows', since: null }; }
    }
  },
  {
    id:       'spiro',
    name:     'Spirometer',
    icon:     '🌬️',
    color:    '#6B4FA8',
    file:     'spirometer_surveillance.html',
    group:    'pulmonary',
    cadence:  1,
    getSummary() {
      try {
        const recs = JSON.parse(localStorage.getItem('spiro_records_v1')||'[]');
        const sets = JSON.parse(localStorage.getItem('spiro_settings_v1')||'{}');
        if (!recs.length) return { val: null, sub: 'Inspiratory volume', since: null };
        const last = recs[recs.length-1];
        const days = daysSince(last.date);
        const pct  = sets.target ? Math.round((last.val/sets.target)*100) : null;
        const alert= sets.target && last.val < sets.target*(sets.warnPct||80)/100 ? 'warn' : null;
        return {
          val:   last.val,
          unit:  'mL',
          sub:   pct !== null ? `${pct}% of target` : 'inspiratory vol',
          since: days,
          alert
        };
      } catch(e) { return { val: null, sub: 'Inspiratory volume', since: null }; }
    }
  },
  {
    id:       'vitals',
    name:     'Vital Signs',
    icon:     '❤️',
    color:    '#C94040',
    file:     'vital_signs_surveillance.html',
    group:    'vitals',
    cadence:  7,
    getSummary() {
      try {
        const vitals = ['spo2','hr','bp','wt','temp'];
        const settings = JSON.parse(localStorage.getItem('vss_settings_v1')||'{}');
        let alerts = [];
        let latestDate = null;
        vitals.forEach(v => {
          const recs = JSON.parse(localStorage.getItem(`vss_${v}_v1`)||'[]');
          if (!recs.length) return;
          const last = recs[recs.length-1];
          if (!latestDate || last.date > latestDate) latestDate = last.date;
          // Check thresholds
          if (v==='spo2'  && last.val < (settings.spo2?.low||92))         alerts.push('SpO₂ low');
          if (v==='hr'    && last.val > (settings.hr?.high||100))          alerts.push('HR high');
          if (v==='temp'  && last.val >= (settings.temp?.high||99.5))      alerts.push('Temp high');
          if (v==='bp'    && last.sys > (settings.bp?.sysHigh||130))       alerts.push('BP high');
        });
        const days = latestDate ? daysSince(latestDate) : null;
        return {
          val:   alerts.length ? `${alerts.length} alert${alerts.length>1?'s':''}` : '✓ Normal',
          unit:  '',
          sub:   alerts.length ? alerts.slice(0,2).join(', ') : '5 vitals tracked',
          since: days,
          alert: alerts.length ? 'danger' : null
        };
      } catch(e) { return { val: null, sub: '5 vitals tracked', since: null }; }
    }
  },
  {
    id:       'labs',
    name:     'Lab Results',
    icon:     '🧪',
    color:    '#0E7490',
    file:     'lab_results_tracker.html',
    group:    'vitals',
    cadence:  null,
    getSummary() {
      try {
        const recs  = JSON.parse(localStorage.getItem('lab_records_v2')||'[]');
        if (!recs.length) return { val: null, sub: 'Auto-extracted from portal', since: null };
        const last  = recs[recs.length-1];
        const flags = Object.keys(last.flags||{});
        const days  = daysSince(last.date);
        return {
          val:   flags.length ? `${flags.length} flag${flags.length>1?'s':''}` : '✓ All normal',
          unit:  '',
          sub:   flags.length ? flags.slice(0,2).join(', ') : `${Object.values(last.values).filter(v=>v!==null).length} values`,
          since: days,
          alert: flags.some(k=>(last.flags[k]==='critical'||last.flags[k]==='high')) ? 'danger' : flags.length ? 'warn' : null
        };
      } catch(e) { return { val: null, sub: 'Lab panel not set up', since: null }; }
    }
  },
  {
    id:       'medlog',
    name:     'Med & Symptom',
    icon:     '🔬',
    color:    '#C4663B',
    file:     'med_symptom_tracker.html',
    group:    'meds',
    cadence:  null,
    getSummary() {
      try {
        const meds = JSON.parse(localStorage.getItem('msc_meds_v1')||'[]');
        const syms = JSON.parse(localStorage.getItem('msc_syms_v1')||'[]');
        const curMeds = JSON.parse(localStorage.getItem('msc_cur_meds_v1')||'[]').filter(m=>m.active);
        const allEntries = [...meds, ...syms].sort((a,b)=>b.date.localeCompare(a.date));
        const last = allEntries[0];
        const days = last ? daysSince(last.date) : null;
        const highSyms = syms.flatMap(s=>Object.entries(s.symptoms||{}).filter(([,v])=>v>=7));
        return {
          val:   curMeds.length ? curMeds.length : (meds.length + syms.length) || null,
          unit:  curMeds.length ? ' active meds' : curMeds.length === 0 ? '' : '',
          sub:   curMeds.length ? `${meds.length} changes, ${syms.length} symptom logs` : 'No entries yet',
          since: days,
          alert: highSyms.length ? 'warn' : null
        };
      } catch(e) { return { val: null, sub: 'Med changes & symptoms', since: null }; }
    }
  }
];

// ══════════════════════════════════════════════
//  GREETING
// ══════════════════════════════════════════════
function setGreeting() {
  const h = new Date().getHours();
  const time = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  document.getElementById('greeting').innerHTML = `${time}, <strong>Cocomi</strong> 👋`;
}

// ══════════════════════════════════════════════
//  DAYS SINCE HELPER
// ══════════════════════════════════════════════
function daysSince(dateStr) {
  if (!dateStr) return null;
  const diff = new Date() - new Date(dateStr);
  return Math.floor(diff / 86400000);
}

function sinceText(days, cadence) {
  if (days === null) return 'Never logged';
  if (days === 0) return 'Today';
  if (days === 1) return 'Yesterday';
  return `${days} days ago`;
}

function isOverdue(days, cadence) {
  if (!cadence || days === null) return false;
  return days >= cadence;
}

// ══════════════════════════════════════════════
//  RENDER DASHBOARD
// ══════════════════════════════════════════════
function renderDashboard() {
  setGreeting();

  const groups = { pulmonary: [], vitals: [], meds: [] };
  let globalAlerts = [];

  MODULES.forEach(mod => {
    const summary = mod.getSummary();
    const days    = summary.since;
    const overdue = isOverdue(days, mod.cadence);
    const sinceStr = sinceText(days, mod.cadence);
    const alertCls = summary.alert === 'danger' ? 'alert-danger' : summary.alert === 'warn' ? 'alert-warn' : overdue ? 'overdue' : '';

    if (summary.alert === 'danger') globalAlerts.push(`${mod.icon} ${mod.name}: ${summary.sub}`);

    const valHtml = summary.val !== null
      ? `<div class="tile-val">${summary.val}<span style="font-size:12px;color:var(--ink3);margin-left:3px">${summary.unit||''}</span></div>`
      : `<div class="tile-empty">No data yet</div>`;

    const tile = `
      <div class="tile ${mod.id} ${alertCls}" onclick="openModule('${mod.id}')">
        <div class="tile-alert-dot"></div>
        <span class="tile-icon">${mod.icon}</span>
        <div class="tile-name">${mod.name}</div>
        ${valHtml}
        <div class="tile-sub">${summary.sub}</div>
        <div class="tile-since ${overdue?'overdue':''}">${overdue ? '⏰ ' : ''}${sinceStr}</div>
      </div>`;

    groups[mod.group].push(tile);
  });

  document.getElementById('tiles-pulmonary').innerHTML = groups.pulmonary.join('');
  document.getElementById('tiles-vitals').innerHTML    = groups.vitals.join('');
  document.getElementById('tiles-meds').innerHTML      = groups.meds.join('');

  // Global alert banner
  const alertEl = document.getElementById('global-alert');
  if (globalAlerts.length) {
    alertEl.innerHTML = `⚠️ <strong>Alerts requiring attention:</strong><br>${globalAlerts.join('<br>')}`;
    alertEl.classList.add('show');
  } else {
    alertEl.classList.remove('show');
  }

  // Last updated
  document.getElementById('last-updated').textContent =
    'Last refreshed ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}

// ══════════════════════════════════════════════
//  MODULE NAVIGATION
// ══════════════════════════════════════════════
function openModule(id) {
  const mod = MODULES.find(m => m.id === id);
  if (!mod) return;

  document.getElementById('view-home').style.display = 'none';
  document.getElementById('view-module').classList.add('active');
  document.getElementById('module-bar-title').textContent = mod.name;

  const iframe = document.getElementById('module-iframe');
  iframe.src = mod.file;
}

function goHome() {
  document.getElementById('view-module').classList.remove('active');
  document.getElementById('view-home').style.display = 'block';
  document.getElementById('module-iframe').src = 'about:blank';
  renderDashboard(); // refresh data on return
}

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════
renderDashboard();

// Auto-refresh dashboard every 60 seconds
setInterval(renderDashboard, 60000);
</script>
</body>
</html>
