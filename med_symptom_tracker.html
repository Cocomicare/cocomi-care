<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Med & Symptom Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

:root {
  --bg:#F0F4F8;--surface:#fff;--surface2:#E8EFF5;--border:#D0DCE8;
  --ink:#1A2533;--ink2:#4A5E72;--ink3:#8A9EAF;
  --good:#2D9E6B;--good-bg:#E8F7F1;--warn:#E07B39;--warn-bg:#FDF0E8;
  --danger:#C94040;--danger-bg:#FAEAEA;
  --med:#6B4FA8;--med-bg:#F0EAFA;--sym:#C4663B;--sym-bg:#FAF0EA;
  --radius:12px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:15px;}

header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;}
.logo{display:flex;align-items:baseline;gap:8px;}
.logo-title{font-family:'DM Serif Display',serif;font-size:18px;color:var(--ink);}
.logo-sub{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;}

.tabs{display:flex;background:var(--surface2);border-bottom:1px solid var(--border);padding:0 16px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:11px 14px;font-size:12px;font-weight:500;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;background:none;border-top:none;border-left:none;border-right:none;flex-shrink:0;}
.tab:hover{color:var(--med);}
.tab.active{color:var(--med);border-bottom-color:var(--med);}

.page{display:none;padding:20px 16px 40px;max-width:600px;margin:0 auto;}
.page.active{display:block;}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;}
.card-title{font-family:'DM Serif Display',serif;font-size:16px;color:var(--ink);margin-bottom:14px;}

/* Form fields */
.field-group{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.field-label{font-size:11px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.3px;}
.field-input,.field-select,.field-textarea{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink);transition:border-color .15s;width:100%;}
.field-input:focus,.field-select:focus,.field-textarea:focus{outline:none;border-color:var(--med);}
.field-textarea{resize:vertical;min-height:72px;}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;}
.btn-primary{background:var(--med);color:#fff;}
.btn-primary:hover{background:#5a3f90;}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--ink2);}
.btn-ghost:hover{border-color:var(--med);color:var(--med);}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1px solid #f0c0c0;}

/* Import bar */
.import-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}

/* Med card */
.med-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;display:flex;align-items:flex-start;gap:10px;}
.med-active-dot{width:10px;height:10px;border-radius:50%;background:var(--good);flex-shrink:0;margin-top:5px;}
.med-inactive-dot{width:10px;height:10px;border-radius:50%;background:var(--ink3);flex-shrink:0;margin-top:5px;}
.med-info{flex:1;}
.med-name{font-size:14px;font-weight:600;color:var(--ink);}
.med-detail{font-size:12px;color:var(--ink3);margin-top:2px;}
.med-actions{display:flex;gap:6px;}

/* Timeline */
.timeline-item{display:flex;gap:12px;margin-bottom:14px;}
.timeline-dot-wrap{display:flex;flex-direction:column;align-items:center;flex-shrink:0;}
.timeline-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.timeline-dot.med{background:var(--med);}
.timeline-dot.sym{background:var(--sym);}
.timeline-line{width:2px;flex:1;background:var(--border);margin-top:4px;}
.timeline-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;flex:1;}
.timeline-date{font-size:11px;color:var(--ink3);font-family:'DM Mono',monospace;margin-bottom:4px;}
.timeline-title{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:3px;}
.timeline-detail{font-size:12px;color:var(--ink2);}

/* Severity chips */
.sev-chips{display:flex;gap:6px;flex-wrap:wrap;}
.sev-chip{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500;border:1.5px solid var(--border);background:var(--bg);color:var(--ink2);cursor:pointer;transition:all .15s;user-select:none;}
.sev-chip.selected{background:var(--sym);color:#fff;border-color:var(--sym);}

/* Symptom chips */
.sym-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.sym-chip{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:500;border:1.5px solid var(--border);background:var(--bg);color:var(--ink2);cursor:pointer;transition:all .15s;user-select:none;}
.sym-chip.selected{background:var(--sym);color:#fff;border-color:var(--sym);}

/* Heatmap */
.heatmap-grid{display:grid;gap:4px;}
.heatmap-cell{border-radius:4px;height:28px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff;}

/* Med import preview */
.med-preview{background:var(--surface2);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:12px;}
.med-preview img{width:100%;max-height:160px;object-fit:contain;display:block;}

/* Notice */
.notice{border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:12px;font-size:13px;}
.notice.success{background:var(--good-bg);color:var(--good);}
.notice.error{background:var(--danger-bg);color:var(--danger);}
.notice.info{background:var(--accent2,#E8F1FA);color:#2563EB;}

/* Empty */
.empty{text-align:center;padding:40px 20px;color:var(--ink3);}
.empty-icon{font-size:36px;margin-bottom:10px;}
.empty-title{font-family:'DM Serif Display',serif;font-size:17px;color:var(--ink2);margin-bottom:5px;}
.empty-sub{font-size:13px;line-height:1.5;}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;z-index:999;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.success{background:var(--good);}
.toast.error{background:var(--danger);}

/* Divider */
.divider{height:1px;background:var(--border);margin:14px 0;}

/* Analyzing */
.analyzing-bar{display:none;align-items:center;gap:10px;padding:12px 16px;background:var(--med-bg);border-radius:var(--radius-sm);margin-bottom:12px;}
.analyzing-spinner{width:20px;height:20px;border:2px solid #c8b0e8;border-top-color:var(--med);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}

@media(max-width:480px){.page{padding:14px 12px 40px;}}
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-title">Med & Symptom</span>
    <span class="logo-sub">Correlation Tracker</span>
  </div>
  <button class="btn btn-ghost btn-sm" onclick="exportData()">↓ Export</button>
</header>

<div class="tabs">
  <button class="tab active" onclick="showTab('timeline')"   id="tab-timeline">Timeline</button>
  <button class="tab"        onclick="showTab('med-change')" id="tab-med-change">+ Med Change</button>
  <button class="tab"        onclick="showTab('symptoms')"   id="tab-symptoms">+ Symptoms</button>
  <button class="tab"        onclick="showTab('meds-list')"  id="tab-meds-list">💊 Current Meds</button>
  <button class="tab"        onclick="showTab('correlations')" id="tab-correlations">Correlations</button>
</div>

<!-- TIMELINE -->
<div class="page active" id="page-timeline">
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
    <button class="btn btn-primary btn-sm" id="filter-all" onclick="setFilter('all')">All</button>
    <button class="btn btn-ghost btn-sm"   id="filter-med" onclick="setFilter('med')">💊 Med changes</button>
    <button class="btn btn-ghost btn-sm"   id="filter-sym" onclick="setFilter('sym')">🩺 Symptoms</button>
  </div>
  <div id="timeline-content"></div>
</div>

<!-- MED CHANGE -->
<div class="page" id="page-med-change">
  <div class="card">
    <div class="card-title">Log a Medication Change</div>
    <div class="field-group">
      <label class="field-label">Date</label>
      <input type="date" class="field-input" id="med-date">
    </div>
    <div class="field-group">
      <label class="field-label">Medication name</label>
      <input type="text" class="field-input" id="med-name" placeholder="e.g. Tacrolimus">
    </div>
    <div class="field-group">
      <label class="field-label">Change type</label>
      <select class="field-select" id="med-change-type">
        <option value="started">Started new medication</option>
        <option value="stopped">Stopped medication</option>
        <option value="increased">Dose increased</option>
        <option value="decreased">Dose decreased</option>
        <option value="changed">Formulation changed</option>
      </select>
    </div>
    <div class="field-group">
      <label class="field-label">Dose (optional)</label>
      <input type="text" class="field-input" id="med-dose" placeholder="e.g. 2mg twice daily">
    </div>
    <div class="field-group">
      <label class="field-label">Reason / notes (optional)</label>
      <textarea class="field-textarea" id="med-notes" placeholder="Clinical reason, prescriber instructions…"></textarea>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="clearMedForm()">Clear</button>
      <button class="btn btn-primary" onclick="saveMedChange()">Save Med Change</button>
    </div>
  </div>
</div>

<!-- SYMPTOMS -->
<div class="page" id="page-symptoms">
  <div class="card">
    <div class="card-title">Log Symptoms</div>
    <div class="field-group">
      <label class="field-label">Date</label>
      <input type="date" class="field-input" id="sym-date">
    </div>
    <div class="field-group">
      <label class="field-label">Symptoms (select all that apply)</label>
      <div class="sym-chips" id="sym-chips"></div>
    </div>
    <div class="field-group">
      <label class="field-label">Severity</label>
      <div class="sev-chips">
        <div class="sev-chip" onclick="selectSev(this)" data-val="1">1 Mild</div>
        <div class="sev-chip" onclick="selectSev(this)" data-val="3">3 Moderate</div>
        <div class="sev-chip" onclick="selectSev(this)" data-val="5">5 Severe</div>
        <div class="sev-chip" onclick="selectSev(this)" data-val="7">7 Very severe</div>
        <div class="sev-chip" onclick="selectSev(this)" data-val="10">10 Extreme</div>
      </div>
    </div>
    <div class="field-group">
      <label class="field-label">Notes (optional)</label>
      <textarea class="field-textarea" id="sym-notes" placeholder="Any context, timing, triggers…"></textarea>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="clearSymForm()">Clear</button>
      <button class="btn btn-primary" onclick="saveSymptom()">Save Symptoms</button>
    </div>
  </div>
</div>

<!-- CURRENT MEDS -->
<div class="page" id="page-meds-list">
  <div class="import-bar">
    <button class="btn btn-primary btn-sm" onclick="openAddMedModal()">✏️ Add Manually</button>
    <button class="btn btn-ghost btn-sm" onclick="document.getElementById('csv-input').click()">📄 Import CSV</button>
    <button class="btn btn-ghost btn-sm" onclick="document.getElementById('img-med-input').click()">📷 Image / PDF</button>
    <button class="btn btn-ghost btn-sm" onclick="pasteMedFromClipboard()">📋 Paste Image</button>
    <input type="file" id="csv-input"     accept=".csv,.txt" style="display:none" onchange="importMedsCSV(this)">
    <input type="file" id="img-med-input" accept="image/*,.pdf,application/pdf" style="display:none" onchange="importMedsImage(this)">
  </div>

  <div class="analyzing-bar" id="med-import-analyzing">
    <div class="analyzing-spinner"></div>
    <div>
      <div style="font-size:13px;font-weight:600;color:var(--med)">Claude is reading your medication list…</div>
      <div style="font-size:11px;color:var(--ink3)">Extracting drug names, doses, and frequencies</div>
    </div>
  </div>

  <div id="med-notice"></div>

  <div id="med-img-preview-wrap" style="display:none;margin-bottom:12px">
    <img id="med-img-preview" style="width:100%;max-height:160px;object-fit:contain;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2)">
  </div>

  <div id="med-review-wrap" style="display:none"></div>

  <h3 style="font-family:'DM Serif Display',serif;font-size:16px;color:var(--ink);margin-bottom:12px">Active Medications</h3>
  <div id="meds-active-list"></div>

  <h3 style="font-family:'DM Serif Display',serif;font-size:14px;color:var(--ink3);margin-top:18px;margin-bottom:10px">Inactive / Stopped</h3>
  <div id="meds-inactive-list"></div>
</div>

<!-- CORRELATIONS -->
<div class="page" id="page-correlations">
  <div id="correlation-content"></div>
</div>

<!-- ADD MED MODAL -->
<div id="add-med-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:flex-end;justify-content:center">
  <div style="background:var(--surface);border-radius:20px 20px 0 0;padding:24px 20px 32px;width:100%;max-width:520px">
    <div style="font-family:'DM Serif Display',serif;font-size:17px;color:var(--ink);margin-bottom:16px" id="add-med-title">Add Medication</div>
    <div class="field-group"><label class="field-label">Drug name</label><input type="text" class="field-input" id="add-med-name" placeholder="e.g. Tacrolimus"></div>
    <div class="field-group"><label class="field-label">Dose</label><input type="text" class="field-input" id="add-med-dose" placeholder="e.g. 2mg"></div>
    <div class="field-group"><label class="field-label">Frequency</label><input type="text" class="field-input" id="add-med-freq" placeholder="e.g. twice daily"></div>
    <div class="field-group"><label class="field-label">Notes (optional)</label><input type="text" class="field-input" id="add-med-notes" placeholder="e.g. take with food"></div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn btn-ghost" style="flex:1" onclick="closeAddMedModal()">Cancel</button>
      <button class="btn btn-primary" style="flex:2" onclick="saveManualMed()">Save Medication</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════
//  STORAGE
// ══════════════════════════════════════════════════
const MEDS_KEY     = 'msc_meds_v1';
const SYMS_KEY     = 'msc_syms_v1';
const CUR_MEDS_KEY = 'msc_cur_meds_v1';

function getMeds()    { try{return JSON.parse(localStorage.getItem(MEDS_KEY)||'[]');}catch(e){return[];} }
function getSyms()    { try{return JSON.parse(localStorage.getItem(SYMS_KEY)||'[]');}catch(e){return[];} }
function getCurMeds() { try{return JSON.parse(localStorage.getItem(CUR_MEDS_KEY)||'[]');}catch(e){return[];} }
function saveMeds(d)    { localStorage.setItem(MEDS_KEY,JSON.stringify(d)); }
function saveSyms(d)    { localStorage.setItem(SYMS_KEY,JSON.stringify(d)); }
function saveCurMeds(d) { localStorage.setItem(CUR_MEDS_KEY,JSON.stringify(d)); }

// ══════════════════════════════════════════════════
//  SYMPTOM DEFINITIONS
// ══════════════════════════════════════════════════
const SYMPTOMS = [
  'Shortness of breath','Fatigue','Cough','Chest tightness','Fever','Wheezing',
  'Night sweats','Weight change','Swelling','Nausea','Headache','Muscle aches','Other'
];

// ══════════════════════════════════════════════════
//  TABS
// ══════════════════════════════════════════════════
function showTab(name) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
  if (name==='timeline')     renderTimeline();
  if (name==='meds-list')    renderMedsList();
  if (name==='correlations') renderCorrelations();
}

// ══════════════════════════════════════════════════
//  TIMELINE
// ══════════════════════════════════════════════════
let currentFilter = 'all';
function setFilter(f) {
  currentFilter = f;
  ['all','med','sym'].forEach(x=>{
    const el = document.getElementById('filter-'+x);
    if(el) el.className = 'btn btn-sm ' + (x===f?'btn-primary':'btn-ghost');
  });
  renderTimeline();
}

function renderTimeline() {
  const meds = getMeds().map(m=>({...m,type:'med'}));
  const syms = getSyms().map(s=>({...s,type:'sym'}));
  let all = [...meds,...syms].sort((a,b)=>b.date.localeCompare(a.date));
  if (currentFilter==='med') all = all.filter(x=>x.type==='med');
  if (currentFilter==='sym') all = all.filter(x=>x.type==='sym');

  const el = document.getElementById('timeline-content');
  if (!all.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">No entries yet</div><div class="empty-sub">Log medication changes and symptoms to build your timeline.</div></div>`;
    return;
  }
  el.innerHTML = all.map((item,i) => {
    const isLast = i === all.length-1;
    const isMed  = item.type === 'med';
    const title  = isMed ? `${item.name} — ${item.changeType||'change'}` : item.symptoms?.join(', ')||'Symptoms';
    const detail = isMed ? (item.dose||'') : `Severity: ${item.severity||'—'}${item.notes?' · '+item.notes:''}`;
    return `
    <div class="timeline-item">
      <div class="timeline-dot-wrap">
        <div class="timeline-dot ${item.type}"></div>
        ${!isLast?'<div class="timeline-line"></div>':''}
      </div>
      <div class="timeline-card">
        <div class="timeline-date">${formatDate(item.date)}</div>
        <div class="timeline-title">${title}</div>
        ${detail?`<div class="timeline-detail">${detail}</div>`:''}
        <button onclick="deleteEntry('${item.type}','${item.id}')" style="margin-top:6px;background:none;border:none;font-size:11px;color:var(--ink3);cursor:pointer">🗑 Delete</button>
      </div>
    </div>`;
  }).join('');
}

function deleteEntry(type, id) {
  if (type==='med') { saveMeds(getMeds().filter(m=>m.id!==id)); }
  else { saveSyms(getSyms().filter(s=>s.id!==id)); }
  renderTimeline();
  showToast('Entry deleted');
}

// ══════════════════════════════════════════════════
//  MED CHANGE FORM
// ══════════════════════════════════════════════════
function saveMedChange() {
  const date       = document.getElementById('med-date').value;
  const name       = document.getElementById('med-name').value.trim();
  const changeType = document.getElementById('med-change-type').value;
  const dose       = document.getElementById('med-dose').value.trim();
  const notes      = document.getElementById('med-notes').value.trim();

  if (!date || !name) { showToast('Date and medication name are required','error'); return; }

  const entry = { id: Date.now().toString(), date, name, changeType, dose, notes };
  const meds  = getMeds();
  meds.push(entry);
  meds.sort((a,b)=>a.date.localeCompare(b.date));
  saveMeds(meds);

  // Also update current meds list
  const cur = getCurMeds();
  if (changeType==='started') {
    if (!cur.find(m=>m.name.toLowerCase()===name.toLowerCase())) {
      cur.push({ id: Date.now().toString(), name, dose, freq:'', notes:'', active:true });
      saveCurMeds(cur);
    }
  } else if (changeType==='stopped') {
    const idx = cur.findIndex(m=>m.name.toLowerCase()===name.toLowerCase());
    if (idx>=0) { cur[idx].active=false; saveCurMeds(cur); }
  }

  clearMedForm();
  showToast('Med change saved ✓','success');
  showTab('timeline');
}

function clearMedForm() {
  ['med-date','med-name','med-dose','med-notes'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value='';
  });
  const dateEl = document.getElementById('med-date');
  if (dateEl) dateEl.value = toDateStr(new Date());
}

// ══════════════════════════════════════════════════
//  SYMPTOM FORM
// ══════════════════════════════════════════════════
function buildSymptomChips() {
  const el = document.getElementById('sym-chips');
  if (!el) return;
  el.innerHTML = SYMPTOMS.map(s=>`<div class="sym-chip" onclick="toggleSym(this)">${s}</div>`).join('');
}

function toggleSym(el) { el.classList.toggle('selected'); }

function selectSev(el) {
  document.querySelectorAll('.sev-chip').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
}

function saveSymptom() {
  const date     = document.getElementById('sym-date').value;
  const selected = [...document.querySelectorAll('.sym-chip.selected')].map(c=>c.textContent);
  const sevEl    = document.querySelector('.sev-chip.selected');
  const notes    = document.getElementById('sym-notes').value.trim();

  if (!date) { showToast('Please set a date','error'); return; }
  if (!selected.length) { showToast('Select at least one symptom','error'); return; }

  const entry = { id: Date.now().toString(), date, symptoms: selected, severity: sevEl?parseInt(sevEl.dataset.val):null, notes };
  const syms  = getSyms();
  syms.push(entry);
  syms.sort((a,b)=>a.date.localeCompare(b.date));
  saveSyms(syms);
  clearSymForm();
  showToast('Symptoms saved ✓','success');
  showTab('timeline');
}

function clearSymForm() {
  const dateEl = document.getElementById('sym-date');
  if (dateEl) dateEl.value = toDateStr(new Date());
  document.querySelectorAll('.sym-chip').forEach(c=>c.classList.remove('selected'));
  document.querySelectorAll('.sev-chip').forEach(c=>c.classList.remove('selected'));
  const notesEl = document.getElementById('sym-notes');
  if (notesEl) notesEl.value = '';
}

// ══════════════════════════════════════════════════
//  CURRENT MEDS LIST
// ══════════════════════════════════════════════════
function renderMedsList() {
  const cur    = getCurMeds();
  const active = cur.filter(m=>m.active);
  const inact  = cur.filter(m=>!m.active);

  const activeEl = document.getElementById('meds-active-list');
  const inactEl  = document.getElementById('meds-inactive-list');

  if (!active.length) {
    activeEl.innerHTML = `<div class="empty"><div class="empty-icon">💊</div><div class="empty-title">No medications added yet</div><div class="empty-sub">Tap "+ Add Med" to build Cocomi's current medication list.<br>Or use Image / PDF to import from discharge paperwork.</div></div>`;
  } else {
    activeEl.innerHTML = active.map(m => medCardHTML(m, true)).join('');
  }
  inactEl.innerHTML = inact.map(m => medCardHTML(m, false)).join('');
}

function medCardHTML(m, active) {
  return `<div class="med-card">
    <div class="${active?'med-active-dot':'med-inactive-dot'}"></div>
    <div class="med-info">
      <div class="med-name">${m.name}</div>
      <div class="med-detail">${[m.dose,m.freq,m.notes].filter(Boolean).join(' · ')||'No details'}</div>
    </div>
    <div class="med-actions">
      <button class="btn btn-ghost btn-sm" onclick="editMed('${m.id}')">Edit</button>
      <button class="btn btn-danger btn-sm" onclick="deleteMed('${m.id}')">✕</button>
    </div>
  </div>`;
}

function deleteMed(id) {
  saveCurMeds(getCurMeds().filter(m=>m.id!==id));
  renderMedsList();
  showToast('Medication removed');
}

let editingMedId = null;
function openAddMedModal() {
  editingMedId = null;
  document.getElementById('add-med-title').textContent = 'Add Medication';
  ['add-med-name','add-med-dose','add-med-freq','add-med-notes'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value='';
  });
  document.getElementById('add-med-modal').style.display = 'flex';
}

function editMed(id) {
  const m = getCurMeds().find(m=>m.id===id);
  if (!m) return;
  editingMedId = id;
  document.getElementById('add-med-title').textContent = 'Edit Medication';
  document.getElementById('add-med-name').value  = m.name||'';
  document.getElementById('add-med-dose').value  = m.dose||'';
  document.getElementById('add-med-freq').value  = m.freq||'';
  document.getElementById('add-med-notes').value = m.notes||'';
  document.getElementById('add-med-modal').style.display = 'flex';
}

function closeAddMedModal() {
  document.getElementById('add-med-modal').style.display = 'none';
}

function saveManualMed() {
  const name  = document.getElementById('add-med-name').value.trim();
  const dose  = document.getElementById('add-med-dose').value.trim();
  const freq  = document.getElementById('add-med-freq').value.trim();
  const notes = document.getElementById('add-med-notes').value.trim();
  if (!name) { showToast('Drug name is required','error'); return; }

  const cur = getCurMeds();
  if (editingMedId) {
    const idx = cur.findIndex(m=>m.id===editingMedId);
    if (idx>=0) cur[idx] = {...cur[idx], name, dose, freq, notes};
  } else {
    cur.push({ id: Date.now().toString(), name, dose, freq, notes, active: true });
  }
  saveCurMeds(cur);
  closeAddMedModal();
  renderMedsList();
  showToast(editingMedId?'Medication updated ✓':'Medication added ✓','success');
}

// ══════════════════════════════════════════════════
//  CSV IMPORT
// ══════════════════════════════════════════════════
function importMedsCSV(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const lines = e.target.result.split('\n').filter(l=>l.trim());
    const meds  = lines.map(line => {
      const parts = line.split(',').map(p=>p.trim().replace(/^"|"$/g,''));
      return { id: Date.now().toString() + Math.random(), name: parts[0]||'', dose: parts[1]||'', freq: parts[2]||'', notes: parts[3]||'', active: true };
    }).filter(m=>m.name);
    const cur = getCurMeds();
    meds.forEach(m => { if (!cur.find(c=>c.name.toLowerCase()===m.name.toLowerCase())) cur.push(m); });
    saveCurMeds(cur);
    renderMedsList();
    showMedNotice(`Found ${meds.length} medication${meds.length!==1?'s':''} in CSV — review below`, 'success');
  };
  reader.readAsText(file);
  input.value = '';
}

// ══════════════════════════════════════════════════
//  IMAGE / PDF IMPORT VIA CLAUDE
// ══════════════════════════════════════════════════
async function importMedsImage(input) {
  const file = input.files ? input.files[0] : input;
  if (!file) return;

  // Show preview
  const previewWrap = document.getElementById('med-img-preview-wrap');
  const previewImg  = document.getElementById('med-img-preview');
  const isPDF = file.type === 'application/pdf' || file.name?.endsWith('.pdf');

  if (isPDF) {
    previewImg.style.display = 'none';
    previewWrap.innerHTML = `<div style="padding:14px 16px;background:var(--surface2);display:flex;align-items:center;gap:12px;border-radius:var(--radius)"><span style="font-size:28px">📄</span><div style="flex:1"><div style="font-size:13px;font-weight:600;color:var(--ink)">${file.name||'Medication List PDF'}</div><div style="font-size:11px;color:var(--ink3)">PDF — Claude will extract medications</div></div><button onclick="document.getElementById('med-img-preview-wrap').style.display='none'" style="background:rgba(0,0,0,.15);color:var(--ink2);border:none;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer">✕</button></div>`;
    previewWrap.style.display = 'block';
  } else {
    const reader = new FileReader();
    reader.onload = e => {
      previewImg.src = e.target.result;
      previewImg.style.display = 'block';
      previewWrap.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }

  const bar = document.getElementById('med-import-analyzing');
  bar.style.display = 'flex';

  try {
    const b64 = await new Promise((res,rej) => {
      const r = new FileReader();
      r.onload = e => res(e.target.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });

    const mimeType = isPDF ? 'application/pdf' : (file.type || 'image/jpeg');
    const fileBlock = isPDF
      ? { type:'document', source:{ type:'base64', media_type:'application/pdf', data:b64 } }
      : { type:'image',    source:{ type:'base64', media_type:mimeType, data:b64 } };

    const prompt = `You are reading a medication list from a medical document, discharge paperwork, or prescription printout.

Extract every medication listed. For each one provide:
- name: the drug name (generic or brand)
- dose: the dose amount (e.g. "2mg", "500mg")
- freq: how often taken (e.g. "twice daily", "once daily", "every 12 hours")
- notes: any special instructions (e.g. "take with food", "morning only") or empty string

Return ONLY a JSON array. No explanation, no markdown, no preamble. Example:
[{"name":"Tacrolimus","dose":"2mg","freq":"twice daily","notes":"morning and evening"},{"name":"Prednisone","dose":"5mg","freq":"once daily","notes":"take with food"}]`;

    const response = await fetch('https://nrurfusjkvuudfzgfsww.supabase.co/functions/v1/claude-proxy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 1000,
        messages: [{ role:'user', content:[ fileBlock, { type:'text', text:prompt } ] }]
      })
    });

    const data = await response.json();
    if (data.error) throw new Error(data.error.message);

    const text = data.content.map(c=>c.text||'').join('').trim();
    let meds;
    try {
      let clean = text.replace(/```json/g,'').replace(/```/g,'').trim();
      const s = clean.indexOf('[') !== -1 ? clean.indexOf('[') : clean.indexOf('{');
      const e = Math.max(clean.lastIndexOf(']'), clean.lastIndexOf('}'));
      if (s !== -1 && e !== -1 && e > s) clean = clean.substring(s, e+1);
      meds = JSON.parse(clean);
    } catch(parseErr) {
      throw new Error('Could not parse medication data');
    }

    if (!Array.isArray(meds) || !meds.length) throw new Error('No medications found in document');

    bar.style.display = 'none';
    showMedReview(meds);

  } catch(err) {
    bar.style.display = 'none';
    showMedNotice('Could not read image: ' + err.message + '. Try manual entry.', 'error');
  }

  if (input.value !== undefined) input.value = '';
}

function showMedReview(meds) {
  const wrap = document.getElementById('med-review-wrap');
  wrap.style.display = 'block';
  wrap.innerHTML = `
    <div class="card">
      <div class="card-title">✓ Claude found ${meds.length} medications — review and confirm</div>
      <p style="font-size:13px;color:var(--ink3);margin-bottom:14px;line-height:1.5">Review the medications below. Edit or remove any before saving.</p>
      <div id="med-review-items">
        ${meds.map((m,i)=>`
          <div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px">
            <div style="display:flex;gap:8px;margin-bottom:6px">
              <input value="${m.name||''}" placeholder="Drug name" style="flex:1;padding:6px 10px;border:1.5px solid var(--border);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:13px;background:var(--surface)" id="rev-name-${i}">
              <button onclick="this.closest('div').parentElement.remove()" style="background:none;border:none;color:var(--ink3);cursor:pointer;font-size:16px;padding:0 4px">✕</button>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
              <input value="${m.dose||''}" placeholder="Dose" style="padding:6px 10px;border:1.5px solid var(--border);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:12px;background:var(--surface)" id="rev-dose-${i}">
              <input value="${m.freq||''}" placeholder="Frequency" style="padding:6px 10px;border:1.5px solid var(--border);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:12px;background:var(--surface)" id="rev-freq-${i}">
            </div>
          </div>`).join('')}
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px">
        <button class="btn btn-ghost" onclick="document.getElementById('med-review-wrap').style.display='none'">Cancel</button>
        <button class="btn btn-primary" onclick="confirmMedImport(${meds.length})">Save All Medications</button>
      </div>
    </div>`;
}

function confirmMedImport(count) {
  const cur = getCurMeds();
  let added = 0;
  for (let i=0; i<count; i++) {
    const nameEl = document.getElementById('rev-name-'+i);
    if (!nameEl) continue;
    const name = nameEl.value.trim();
    const dose = document.getElementById('rev-dose-'+i)?.value.trim()||'';
    const freq = document.getElementById('rev-freq-'+i)?.value.trim()||'';
    if (!name) continue;
    if (!cur.find(m=>m.name.toLowerCase()===name.toLowerCase())) {
      cur.push({ id: Date.now().toString()+i, name, dose, freq, notes:'', active:true });
      added++;
    }
  }
  saveCurMeds(cur);
  document.getElementById('med-review-wrap').style.display = 'none';
  document.getElementById('med-img-preview-wrap').style.display = 'none';
  renderMedsList();
  showToast(`${added} medication${added!==1?'s':''} saved ✓`, 'success');
}

function showMedNotice(msg, type) {
  const el = document.getElementById('med-notice');
  el.innerHTML = `<div class="notice ${type}">${msg}</div>`;
  setTimeout(()=>{ if(el) el.innerHTML=''; }, 5000);
}

// ══════════════════════════════════════════════════
//  CLIPBOARD PASTE
// ══════════════════════════════════════════════════
async function pasteMedFromClipboard() {
  try {
    if (!navigator.clipboard || !navigator.clipboard.read) { showToast('Use upload button instead',''); return; }
    const items = await navigator.clipboard.read();
    let imageItem = null;
    for (const item of items) {
      const imageType = item.types.find(t=>t.startsWith('image/'));
      if (imageType) { imageItem = { item, type: imageType }; break; }
    }
    if (!imageItem) { showToast('No image in clipboard — copy a screenshot first',''); return; }
    const blob = await imageItem.item.getType(imageItem.type);
    const file = new File([blob], 'clipboard.png', { type: imageItem.type });
    showToast('Image pasted ✓', 'success');
    await importMedsImage({ files: [file] });
  } catch(err) {
    if (err.name==='NotAllowedError') showToast('Allow clipboard access in browser settings','');
    else showToast('Could not paste: '+err.message,'');
  }
}

document.addEventListener('paste', async (e) => {
  const medsPage = document.getElementById('page-meds-list');
  if (!medsPage || !medsPage.classList.contains('active')) return;
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      const file = item.getAsFile();
      if (!file) return;
      showToast('Image pasted ✓', 'success');
      await importMedsImage({ files: [file] });
      return;
    }
  }
});

// ══════════════════════════════════════════════════
//  CORRELATIONS
// ══════════════════════════════════════════════════
function renderCorrelations() {
  const meds = getMeds();
  const syms = getSyms();
  const el   = document.getElementById('correlation-content');

  if (!meds.length || !syms.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">🔗</div><div class="empty-title">Not enough data yet</div><div class="empty-sub">Log at least one medication change and one symptom entry to see correlations.</div></div>`;
    return;
  }

  // Simple timeline correlation display
  const all = [...meds.map(m=>({...m,type:'med'})),...syms.map(s=>({...s,type:'sym'}))].sort((a,b)=>a.date.localeCompare(b.date));
  const dates = [...new Set(all.map(x=>x.date))].slice(-14);

  el.innerHTML = `
    <div class="card">
      <div class="card-title">Medication & Symptom Correlation</div>
      <p style="font-size:13px;color:var(--ink3);margin-bottom:14px;line-height:1.5">
        Shows med changes and symptom entries on the same timeline. Look for symptoms that appear shortly after medication changes.
      </p>
      ${dates.map(date => {
        const dayMeds = meds.filter(m=>m.date===date);
        const daySyms = syms.filter(s=>s.date===date);
        if (!dayMeds.length && !daySyms.length) return '';
        return `
          <div style="margin-bottom:12px">
            <div style="font-size:11px;font-weight:600;color:var(--ink3);font-family:'DM Mono',monospace;margin-bottom:6px">${formatDate(date)}</div>
            ${dayMeds.map(m=>`<div style="background:var(--med-bg);border-radius:6px;padding:6px 10px;margin-bottom:4px;font-size:12px;color:var(--med)">💊 ${m.name} — ${m.changeType||'change'}${m.dose?' ('+m.dose+')':''}</div>`).join('')}
            ${daySyms.map(s=>`<div style="background:var(--sym-bg);border-radius:6px;padding:6px 10px;margin-bottom:4px;font-size:12px;color:var(--sym)">🩺 ${s.symptoms?.join(', ')||'Symptoms'}${s.severity?' — severity '+s.severity:''}</div>`).join('')}
          </div>`;
      }).join('')}
    </div>`;
}

// ══════════════════════════════════════════════════
//  EXPORT
// ══════════════════════════════════════════════════
function exportData() {
  const data = { meds: getMeds(), symptoms: getSyms(), currentMeds: getCurMeds(), exportDate: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `med_symptom_${toDateStr(new Date())}.json`;
  a.click();
}

// ══════════════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════════════
function toDateStr(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function formatDate(d) { if(!d) return '—'; const[y,m,day]=d.split('-'); return `${m}/${day}/${y}`; }
function showToast(msg,type='') { const el=document.getElementById('toast'); el.textContent=msg; el.className='toast show'+(type?' '+type:''); setTimeout(()=>el.className='toast',2800); }

// ══════════════════════════════════════════════════
buildSymptomChips();
clearMedForm();
clearSymForm();
renderTimeline();
