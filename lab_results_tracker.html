<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Results — Cocomi Care</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

:root {
  --bg:#F0F4F8;--surface:#fff;--surface2:#E8EFF5;--border:#D0DCE8;
  --ink:#1A2533;--ink2:#4A5E72;--ink3:#8A9EAF;
  --good:#2D9E6B;--good-bg:#E8F7F1;
  --warn:#E07B39;--warn-bg:#FDF0E8;
  --danger:#C94040;--danger-bg:#FAEAEA;
  --lab:#0E7490;--lab-bg:#E0F2F5;--lab-light:#f0fafc;
  --radius:12px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;}

/* ── LAYOUT ── */
.app{display:flex;flex-direction:column;height:100vh;max-width:680px;margin:0 auto;background:var(--surface);box-shadow:0 0 40px rgba(0,0,0,.08);}

/* ── HEADER ── */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:56px;flex-shrink:0;position:sticky;top:0;z-index:50;}
.header-left{display:flex;align-items:baseline;gap:8px;}
.header-title{font-family:'DM Serif Display',serif;font-size:18px;color:var(--ink);}
.header-sub{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;}
.header-actions{display:flex;gap:8px;}
.hbtn{background:none;border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:500;color:var(--ink2);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;}
.hbtn:hover{border-color:var(--lab);color:var(--lab);}
.hbtn.active{background:var(--lab);color:#fff;border-color:var(--lab);}

/* ── VIEWS ── */
.view{display:none;flex:1;flex-direction:column;overflow:hidden;}
.view.active{display:flex;}

/* ── CHAT VIEW ── */
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;}
.chat-messages::-webkit-scrollbar{width:4px;}
.chat-messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* Message bubbles */
.msg{display:flex;gap:10px;max-width:100%;}
.msg.user{flex-direction:row-reverse;}
.msg-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;margin-top:2px;}
.msg.assistant .msg-avatar{background:var(--lab-bg);color:var(--lab);}
.msg.user .msg-avatar{background:var(--surface2);color:var(--ink2);}
.msg-bubble{max-width:85%;padding:11px 14px;border-radius:14px;line-height:1.55;font-size:14px;}
.msg.assistant .msg-bubble{background:var(--surface2);color:var(--ink);border-radius:4px 14px 14px 14px;}
.msg.user .msg-bubble{background:var(--lab);color:#fff;border-radius:14px 4px 14px 14px;}
.msg-bubble p{margin-bottom:8px;}
.msg-bubble p:last-child{margin-bottom:0;}
.msg-bubble ul,.msg-bubble ol{margin:6px 0 8px 18px;}
.msg-bubble li{margin-bottom:4px;}
.msg-bubble strong{font-weight:600;}
.msg-bubble .flag-high{color:#ff6b6b;font-weight:600;}
.msg-bubble .flag-low{color:#6b8cff;font-weight:600;}
.msg-bubble .flag-ok{color:#51cf66;}
.msg-time{font-size:10px;color:var(--ink3);margin-top:4px;text-align:right;}
.msg.user .msg-time{text-align:left;}

/* Lab upload card in chat */
.lab-card{background:var(--lab-light);border:1px solid var(--lab-bg);border-radius:10px;padding:12px 14px;margin-bottom:4px;display:flex;align-items:center;gap:10px;}
.lab-card-icon{font-size:22px;flex-shrink:0;}
.lab-card-info{flex:1;min-width:0;}
.lab-card-name{font-size:13px;font-weight:600;color:var(--lab);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lab-card-sub{font-size:11px;color:var(--ink3);}

/* Typing indicator */
.typing{display:flex;align-items:center;gap:10px;padding:0 4px;}
.typing-dots{display:flex;gap:4px;}
.typing-dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);animation:bounce .8s infinite;}
.typing-dot:nth-child(2){animation-delay:.15s;}
.typing-dot:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,80%,100%{transform:scale(0.6);opacity:.4}40%{transform:scale(1);opacity:1}}

/* Suggested prompts */
.suggestions{padding:8px 16px 0;display:flex;flex-wrap:wrap;gap:6px;}
.suggestion{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px;color:var(--ink2);cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;}
.suggestion:hover{background:var(--lab-bg);border-color:var(--lab);color:var(--lab);}

/* ── INPUT BAR ── */
.input-bar{border-top:1px solid var(--border);padding:12px 16px;background:var(--surface);flex-shrink:0;}
.upload-preview{background:var(--lab-light);border:1px solid var(--lab-bg);border-radius:8px;padding:8px 12px;margin-bottom:8px;display:none;align-items:center;gap:8px;}
.upload-preview.show{display:flex;}
.upload-preview-name{font-size:12px;font-weight:500;color:var(--lab);flex:1;}
.upload-preview-remove{background:none;border:none;color:var(--ink3);cursor:pointer;font-size:14px;padding:0;}
.input-row{display:flex;gap:8px;align-items:flex-end;}
.attach-btn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border);background:var(--bg);color:var(--ink3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;transition:all .15s;}
.attach-btn:hover{border-color:var(--lab);color:var(--lab);background:var(--lab-bg);}
.msg-input{flex:1;border:1.5px solid var(--border);border-radius:20px;padding:9px 14px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink);background:var(--bg);resize:none;outline:none;max-height:120px;line-height:1.4;transition:border-color .15s;}
.msg-input:focus{border-color:var(--lab);background:var(--lab-light);}
.send-btn{width:36px;height:36px;border-radius:50%;border:none;background:var(--lab);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:all .15s;}
.send-btn:hover{background:#0c6680;}
.send-btn:disabled{background:var(--border);cursor:not-allowed;}
input[type=file]{display:none;}

/* ── HISTORY VIEW ── */
.history-view{flex:1;overflow-y:auto;padding:16px;}
.hist-section-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);margin:14px 0 8px;}
.hist-entry{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:all .15s;}
.hist-entry:hover{border-color:var(--lab);background:var(--lab-light);}
.hist-entry-date{font-family:'DM Mono',monospace;font-size:12px;color:var(--ink3);margin-bottom:4px;}
.hist-entry-preview{font-size:13px;color:var(--ink2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.hist-entry-badge{display:inline-block;margin-top:6px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--lab-bg);color:var(--lab);}

/* ── EMPTY STATE ── */
.empty-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;}
.empty-icon{font-size:48px;margin-bottom:16px;}
.empty-title{font-family:'DM Serif Display',serif;font-size:22px;color:var(--ink);margin-bottom:8px;}
.empty-sub{font-size:14px;color:var(--ink2);line-height:1.6;max-width:380px;margin-bottom:24px;}
.empty-start-btn{background:var(--lab);color:#fff;border:none;border-radius:20px;padding:12px 28px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;}
.empty-start-btn:hover{background:#0c6680;}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;z-index:999;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.success{background:var(--good);}
.toast.error{background:var(--danger);}
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <span class="header-title">Lab Results</span>
      <span class="header-sub">AI Assistant</span>
    </div>
    <div class="header-actions">
      <button class="hbtn active" onclick="showView('chat')" id="btn-chat">💬 Chat</button>
      <button class="hbtn" onclick="showView('history')" id="btn-history">📋 History</button>
      <button class="hbtn" onclick="clearConfirm()" id="btn-clear">🗑</button>
    </div>
  </div>

  <!-- CHAT VIEW -->
  <div class="view active" id="view-chat">
    <div class="chat-messages" id="chat-messages">
      <!-- Messages render here -->
    </div>
    <div class="suggestions" id="suggestions"></div>
    <div class="input-bar">
      <div class="upload-preview" id="upload-preview">
        <span style="font-size:18px">📄</span>
        <span class="upload-preview-name" id="upload-preview-name"></span>
        <button class="upload-preview-remove" onclick="removeAttachment()">✕</button>
      </div>
      <div class="input-row">
        <button class="attach-btn" onclick="document.getElementById('file-input').click()" title="Attach lab document">📎</button>
        <input type="file" id="file-input" accept="image/*,.pdf,application/pdf" onchange="handleFileAttach(this)">
        <textarea class="msg-input" id="msg-input" placeholder="Ask about your labs, upload a result, or ask what's trending…" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">↑</button>
      </div>
    </div>
  </div>

  <!-- HISTORY VIEW -->
  <div class="view" id="view-history">
    <div class="history-view" id="history-content"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════
//  STORAGE
// ══════════════════════════════════════════════════
const CONV_KEY    = 'lab_conversation_v1';  // full conversation history
const SUMM_KEY    = 'lab_summary_v1';       // running summary for context compression
const FILES_KEY   = 'lab_files_v1';        // metadata of uploaded files

function getConversation() { try{return JSON.parse(localStorage.getItem(CONV_KEY)||'[]');}catch(e){return[];} }
function getSummary()      { try{return localStorage.getItem(SUMM_KEY)||'';}catch(e){return '';} }
function getFiles()        { try{return JSON.parse(localStorage.getItem(FILES_KEY)||'[]');}catch(e){return[];} }
function saveConversation(d) { localStorage.setItem(CONV_KEY,JSON.stringify(d)); }
function saveSummary(s)      { localStorage.setItem(SUMM_KEY,s); }
function saveFiles(d)        { localStorage.setItem(FILES_KEY,JSON.stringify(d)); }

// ══════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════
let pendingFile   = null;   // { name, b64, mime }
let isTyping      = false;
let conversation  = [];     // { role, content (text or array), displayText, timestamp, hasFile, fileName }

// ══════════════════════════════════════════════════
//  SYSTEM PROMPT
// ══════════════════════════════════════════════════
function buildSystemPrompt() {
  const summary = getSummary();
  const files   = getFiles();
  const fileList = files.length
    ? '\n\nPreviously uploaded lab documents:\n' + files.map(f => `- ${f.name} (${f.date})`).join('\n')
    : '';

  return `You are a knowledgeable and caring medical assistant helping Cocomi, a young lung transplant patient at UF Health Shands in Gainesville, Florida, monitor her post-transplant lab results.

Your role:
- Analyze lab results uploaded in images or PDFs
- Track trends across multiple uploads over time
- Flag values outside reference ranges with clinical context
- Explain what abnormal values might mean for a post-transplant patient
- Connect patterns across different lab panels (CBC, CMP, immunosuppression levels, inflammation markers, etc.)
- Answer questions in plain language that a patient and family can understand
- Always remind the user that findings should be discussed with the transplant team

Clinical context:
- Cocomi recently received a lung transplant
- She is on immunosuppressant medications (tacrolimus, CellCept, prednisone, and others)
- Immunosuppression creates a balance between rejection risk and infection risk
- Her CBC, CMP, tacrolimus levels, and inflammation markers are monitored regularly
- Elevated WBC/neutrophils with low lymphocytes is expected with immunosuppression
- Tacrolimus levels must stay in therapeutic range (typically 8-12 ng/mL early post-transplant)

When analyzing a new lab upload:
1. List every test found with value, reference range, and flag (HIGH/LOW/NORMAL)
2. Highlight values that are clinically significant
3. Note any trends compared to previously discussed results
4. Give a brief plain-language summary of what the overall picture shows
5. Suggest questions to ask the transplant team if warranted

Always be warm, clear, and reassuring while being medically accurate.
${summary ? '\n\nConversation summary so far:\n' + summary : ''}${fileList}`;
}

// ══════════════════════════════════════════════════
//  CLAUDE API
// ══════════════════════════════════════════════════
async function callClaude(messages) {
  const res = await fetch('https://nrurfusjkvuudfzgfsww.supabase.co/functions/v1/claude-proxy', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model:      'claude-sonnet-4-5',
      max_tokens: 2000,
      system:     buildSystemPrompt(),
      messages:   messages
    })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.content.map(c => c.text||'').join('').trim();
}

// ══════════════════════════════════════════════════
//  FILE HANDLING
// ══════════════════════════════════════════════════
function handleFileAttach(input) {
  const file = input.files?.[0];
  if (!file) return;
  input.value = '';

  const reader = new FileReader();
  reader.onload = e => {
    const b64  = e.target.result.split(',')[1];
    const mime = file.type === 'application/pdf' || file.name.endsWith('.pdf')
      ? 'application/pdf' : (file.type || 'image/jpeg');
    pendingFile = { name: file.name, b64, mime };
    document.getElementById('upload-preview').classList.add('show');
    document.getElementById('upload-preview-name').textContent = file.name;
    document.getElementById('msg-input').placeholder = 'Add a message or just send to analyze this document…';
    document.getElementById('msg-input').focus();
  };
  reader.readAsDataURL(file);
}

function removeAttachment() {
  pendingFile = null;
  document.getElementById('upload-preview').classList.remove('show');
  document.getElementById('msg-input').placeholder = 'Ask about your labs, upload a result, or ask what\'s trending…';
}

// ══════════════════════════════════════════════════
//  SEND MESSAGE
// ══════════════════════════════════════════════════
async function sendMessage() {
  const input   = document.getElementById('msg-input');
  const userText= input.value.trim();
  const file    = pendingFile;

  if (!userText && !file) return;
  if (isTyping) return;

  // Build user message for API
  let apiContent;
  let displayText = userText;

  if (file) {
    const fileBlock = file.mime === 'application/pdf'
      ? { type:'document', source:{ type:'base64', media_type:'application/pdf', data:file.b64 } }
      : { type:'image',    source:{ type:'base64', media_type:file.mime, data:file.b64 } };

    const textPrompt = userText || 'Please analyze this lab result. List every test found, flag any out-of-range values, note any trends compared to previous results, and give me a plain-language summary.';
    apiContent = [ fileBlock, { type:'text', text: textPrompt } ];
    displayText = userText || `📄 Uploaded: ${file.name}`;

    // Track uploaded file
    const files = getFiles();
    files.push({ name: file.name, date: new Date().toLocaleDateString() });
    saveFiles(files);
  } else {
    apiContent = userText;
  }

  // Clear input
  input.value = '';
  autoResize(input);
  removeAttachment();
  hideSuggestions();

  // Add user message to UI
  const userMsg = {
    role: 'user',
    content: apiContent,
    displayText,
    timestamp: new Date().toISOString(),
    hasFile: !!file,
    fileName: file?.name || null
  };
  conversation.push(userMsg);
  renderMessage(userMsg);
  scrollToBottom();

  // Show typing indicator
  isTyping = true;
  showTyping();
  document.getElementById('send-btn').disabled = true;

  try {
    // Build API messages — use stored conversation but limit context window
    const apiMessages = buildAPIMessages();

    const response = await callClaude(apiMessages);

    hideTyping();
    isTyping = false;
    document.getElementById('send-btn').disabled = false;

    const assistantMsg = {
      role: 'assistant',
      content: response,
      displayText: response,
      timestamp: new Date().toISOString()
    };
    conversation.push(assistantMsg);
    renderMessage(assistantMsg);
    scrollToBottom();
    saveConversation(conversation);

    // Compress old context if conversation is getting long
    if (conversation.length > 20) compressOldContext();

    // Show follow-up suggestions
    showSuggestions(response);

  } catch(err) {
    hideTyping();
    isTyping = false;
    document.getElementById('send-btn').disabled = false;
    showToast('Error: ' + err.message, 'error');
  }
}

// Build API messages with context management
function buildAPIMessages() {
  // Include last 10 exchanges max to stay within context limits
  // For older messages with files, include only text summary
  const recent = conversation.slice(-20);
  return recent.map(msg => ({
    role: msg.role,
    content: msg.role === 'user' && msg.content !== msg.displayText
      ? msg.content  // keep file content for recent messages
      : (typeof msg.content === 'string' ? msg.content : msg.displayText)
  }));
}

// Compress old context into summary
async function compressOldContext() {
  const old = conversation.slice(0, -10);
  if (old.length < 4) return;
  try {
    const summaryPrompt = `Summarize the key medical findings and discussion from this conversation in 3-5 bullet points. Focus on: lab values discussed, trends noted, clinical concerns raised, and recommendations made. Be specific with numbers.\n\n${old.map(m=>m.role.toUpperCase()+': '+m.displayText).join('\n\n')}`;
    const summary = await callClaude([{ role:'user', content: summaryPrompt }]);
    const existing = getSummary();
    saveSummary((existing ? existing + '\n\n---\n\n' : '') + summary);
    conversation = conversation.slice(-10);
    saveConversation(conversation);
  } catch(e) {
    // Silent fail — not critical
  }
}

// ══════════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════════
function renderMessage(msg) {
  const container = document.getElementById('chat-messages');
  const isEmpty   = container.querySelector('.empty-chat');
  if (isEmpty) isEmpty.remove();

  const div  = document.createElement('div');
  div.className = 'msg ' + msg.role;

  const avatar = msg.role === 'assistant' ? '🧬' : '👤';
  const time   = new Date(msg.timestamp).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

  let bubbleContent = '';

  if (msg.hasFile && msg.fileName) {
    bubbleContent += `<div class="lab-card">
      <div class="lab-card-icon">${msg.fileName.endsWith('.pdf')?'📄':'🖼️'}</div>
      <div class="lab-card-info">
        <div class="lab-card-name">${msg.fileName}</div>
        <div class="lab-card-sub">Lab document uploaded for analysis</div>
      </div>
    </div>`;
  }

  if (msg.displayText && msg.displayText !== `📄 Uploaded: ${msg.fileName}`) {
    bubbleContent += formatMessage(msg.displayText);
  } else if (!msg.hasFile) {
    bubbleContent += formatMessage(msg.displayText);
  }

  div.innerHTML = `
    <div class="msg-avatar">${avatar}</div>
    <div>
      <div class="msg-bubble">${bubbleContent}</div>
      <div class="msg-time">${time}</div>
    </div>`;

  container.appendChild(div);
}

function formatMessage(text) {
  if (!text) return '';
  // Convert markdown-like formatting
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`(.+?)`/g,'<code style="background:rgba(0,0,0,.08);padding:1px 4px;border-radius:3px;font-family:DM Mono,monospace;font-size:12px">$1</code>')
    .replace(/\bHIGH\b/g,'<span class="flag-high">HIGH ↑</span>')
    .replace(/\bLOW\b/g,'<span class="flag-low">LOW ↓</span>')
    .replace(/\bNORMAL\b/g,'<span class="flag-ok">NORMAL ✓</span>')
    .replace(/\n\n/g,'</p><p>')
    .replace(/\n/g,'<br>')
    .replace(/^(.+)$/,'<p>$1</p>');
}

function showTyping() {
  const container = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = 'typing-indicator';
  div.innerHTML = `
    <div class="msg-avatar">🧬</div>
    <div class="msg-bubble">
      <div class="typing">
        <div class="typing-dots">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
        <span style="font-size:12px;color:var(--ink3)">Analyzing…</span>
      </div>
    </div>`;
  container.appendChild(div);
  scrollToBottom();
}

function hideTyping() {
  document.getElementById('typing-indicator')?.remove();
}

function scrollToBottom() {
  const el = document.getElementById('chat-messages');
  setTimeout(() => el.scrollTop = el.scrollHeight, 50);
}

// ══════════════════════════════════════════════════
//  SUGGESTIONS
// ══════════════════════════════════════════════════
const SUGGESTIONS = [
  "What's trending in my recent labs?",
  "Are any values concerning for rejection?",
  "What do my WBC levels mean?",
  "How are my kidney function markers?",
  "Explain my immunosuppression levels",
  "Compare this to my last CBC",
  "What should I ask my transplant team?",
  "Are there any infection signs?"
];

function showSuggestions(lastResponse) {
  const conv = getConversation();
  if (conv.length < 2) return;
  const el = document.getElementById('suggestions');
  // Pick 3 contextually relevant suggestions
  const picks = SUGGESTIONS.sort(()=>Math.random()-.5).slice(0,3);
  el.innerHTML = picks.map(s =>
    `<button class="suggestion" onclick="quickSend('${s.replace(/'/g,"\\'")}')"> ${s}</button>`
  ).join('');
}

function hideSuggestions() {
  document.getElementById('suggestions').innerHTML = '';
}

function quickSend(text) {
  document.getElementById('msg-input').value = text;
  sendMessage();
}

// ══════════════════════════════════════════════════
//  HISTORY VIEW
// ══════════════════════════════════════════════════
function renderHistory() {
  const conv  = conversation;
  const files = getFiles();
  const el    = document.getElementById('history-content');

  if (!conv.length) {
    el.innerHTML = `<div style="text-align:center;padding:40px 20px;color:var(--ink3)">
      <div style="font-size:32px;margin-bottom:10px">📋</div>
      <div style="font-family:'DM Serif Display',serif;font-size:17px;color:var(--ink2);margin-bottom:5px">No conversation yet</div>
      <div style="font-size:13px">Start a chat to analyze your lab results</div>
    </div>`;
    return;
  }

  let html = '';

  if (files.length) {
    html += `<div class="hist-section-title">Uploaded Documents</div>`;
    html += files.map(f => `
      <div class="hist-entry">
        <div class="hist-entry-date">${f.date}</div>
        <div class="hist-entry-preview">📄 ${f.name}</div>
      </div>`).join('');
  }

  html += `<div class="hist-section-title">Conversation (${conv.length} messages)</div>`;

  // Show assistant messages as history entries
  const assistantMsgs = conv.filter(m => m.role === 'assistant');
  html += assistantMsgs.map(m => `
    <div class="hist-entry" onclick="showView('chat')">
      <div class="hist-entry-date">${new Date(m.timestamp).toLocaleString()}</div>
      <div class="hist-entry-preview">${m.displayText?.substring(0,150)||''}</div>
    </div>`).join('');

  const summary = getSummary();
  if (summary) {
    html += `<div class="hist-section-title">Compressed Summary</div>
    <div class="hist-entry">
      <div class="hist-entry-preview">${summary.substring(0,300)}…</div>
      <span class="hist-entry-badge">Auto-compressed</span>
    </div>`;
  }

  el.innerHTML = html;
}

// ══════════════════════════════════════════════════
//  CLEAR / RESET
// ══════════════════════════════════════════════════
function clearConfirm() {
  if (!confirm('Clear entire conversation and lab history? This cannot be undone.')) return;
  localStorage.removeItem(CONV_KEY);
  localStorage.removeItem(SUMM_KEY);
  localStorage.removeItem(FILES_KEY);
  conversation = [];
  document.getElementById('chat-messages').innerHTML = '';
  showEmptyState();
  showToast('Conversation cleared');
}

// ══════════════════════════════════════════════════
//  VIEWS
// ══════════════════════════════════════════════════
function showView(name) {
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.hbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.getElementById('btn-'+name).classList.add('active');
  if (name === 'history') renderHistory();
}

// ══════════════════════════════════════════════════
//  EMPTY STATE
// ══════════════════════════════════════════════════
function showEmptyState() {
  const el = document.getElementById('chat-messages');
  el.innerHTML = `
    <div class="empty-chat">
      <div class="empty-icon">🧬</div>
      <div class="empty-title">Lab Results Assistant</div>
      <div class="empty-sub">Upload any lab result — CBC, CMP, tacrolimus levels, inflammation markers — and I'll analyze it, flag abnormal values, track trends over time, and answer your questions in plain language.</div>
      <button class="empty-start-btn" onclick="document.getElementById('file-input').click()">📎 Upload First Lab Result</button>
    </div>`;
}

// ══════════════════════════════════════════════════
//  INPUT HELPERS
// ══════════════════════════════════════════════════
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ══════════════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════════════
function showToast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type?' '+type:'');
  setTimeout(() => el.className='toast', 3000);
}

// ══════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════
function init() {
  conversation = getConversation();
  const el     = document.getElementById('chat-messages');

  if (!conversation.length) {
    showEmptyState();
    return;
  }

  // Restore conversation
  conversation.forEach(msg => renderMessage(msg));
  scrollToBottom();

  // Show suggestions if there's history
  if (conversation.length >= 2) {
    showSuggestions('');
  }
}

init();
</script>
</body>
</html>
